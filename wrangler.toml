name = "almar"
account_id = "f1d9a1fa3abdda98c15161b00b40385c"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Static first: a request that matches a file in ./out never runs this script. worker/almar.mjs forwards only
# lib/server-routes.ts paths to Next (job 10); everything else gets the static 404.
main = "worker/almar.mjs"
workers_dev = false
preview_urls = false

[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "almarprivatejourney.com"
custom_domain = true

[[routes]]
pattern = "www.almarprivatejourney.com"
custom_domain = true
