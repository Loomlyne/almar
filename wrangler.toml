name = "almar"
account_id = "f1d9a1fa3abdda98c15161b00b40385c"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Static first (job 10): a request for a file in ./out is answered with no Worker call, and run_worker_first sends
# /api/* to the script. A miss reaches the 404 page without the Worker only for browser navigations
# (Sec-Fetch-Mode: navigate); curl, fetch, bots and scanners that miss do invoke the script, which still answers the
# static 404 and counts toward the Free plan's 100k Worker requests a day. worker/almar.mjs forwards only
# lib/server-routes.ts paths to Next.
main = "worker/almar.mjs"
workers_dev = false
preview_urls = false

[assets]
directory = "./out"
binding = "ASSETS"
# Job 21: "/" runs the Worker (the language redirect in worker/handle.mjs: cookie almar-locale, else /en/); the old
# unprefixed pages are 301s in public/_redirects (asset layer, no Worker call).
run_worker_first = ["/", "/api/*", "/en/login", "/ar/login", "/es/login", "/auth/confirm", "/auth/sign-out", "/auth/handoff/start", "/en/account", "/ar/account", "/es/account", "/en/bookings", "/ar/bookings", "/es/bookings", "/newsletter"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "almarprivatejourney.com"
custom_domain = true

[[routes]]
pattern = "www.almarprivatejourney.com"
custom_domain = true

# The public forms' rate limit (plan 03.3-26; lib/form-rate-limit.ts): 5 posts a minute per form and visitor address,
# keyed "<form>:<CF-Connecting-IP>". POST /api/contact (scope "contact") and POST /newsletter (scope "newsletter", plan 27).
[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
