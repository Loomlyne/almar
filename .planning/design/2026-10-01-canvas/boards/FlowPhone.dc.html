<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fffaf0; font-family: 'Lato', Arial, sans-serif; color: #262626; display: flex; flex-direction: column;">

<a href="HeroPhone.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #262626;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 700;">Cartagena · 12/10 – 17/10</span><span style="font-size: 12px; color: #63615f;">2 guests · 5 nights</span></span>
<button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1f3b40; font-family: inherit; font-size: 13px; font-weight: 700; text-decoration: underline;">Edit</button>

<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
<span style="height: 3px; background: #1f3b40; display: block;"></span><span style="height: 3px; background: #1f3b40; display: block;"></span><span style="height: 3px; background: rgba(38, 38, 38, 0.14); display: block;"></span><span style="height: 3px; background: rgba(38, 38, 38, 0.14); display: block;"></span>

<span style="font-size: 12px; font-weight: 700; color: #63615f;">Step 2 of 4 · Add-ons</span>
<h1 style="margin: 4px 0 0; font-family: 'Questa', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 34px; color: #1f3b40;">Shape your journey</h1>
<div role="group" aria-label="Filter" style="display: flex; padding: 6px 0 10px;">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
</div>

<div tabindex="0" aria-label="Add-ons list, scrolls" style="flex-grow: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="min-height: 44px; padding: 10px 14px; background: #d1dfe0; color: #1f3b40; font-size: 13px; line-height: 19px; flex-shrink: 0;"><strong>Included:</strong> airport meet, transfer, stay, guide, security, insurance, return.</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div style="{{it.rowStyle}}">
<img src="{{it.img}}" alt="{{it.alt}}" style="width: 84px; height: 84px; object-fit: cover; display: block; flex-shrink: 0;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: #63615f;">{{it.kind}}</span><span style="font-size: 16px; line-height: 20px; font-weight: 700; color: #1f3b40;">{{it.name}}</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">AED [PRICE]</span></div>
<button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.on}}" aria-label="{{it.aria}}" style="{{it.btnStyle}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{it.off}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></sc-if></button>
</div>
</sc-for>
</div>

<div style="height: 88px; padding: 0 20px; display: flex; align-items: center; gap: 14px; border-top: 1px solid rgba(38, 38, 38, 0.14); background: #fffaf0; flex-shrink: 0;">
<button type="button" style="flex-grow: 1; height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; font-family: inherit; text-align: start; padding: 0;"><span style="font-size: 12px; color: #63615f;">{{totalLine}}</span><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: underline;">AED [AMOUNT]</span></button>
<button type="button" style="height: 56px; padding: 0 24px; border: 0; background: #1f3b40; color: #fffaf0; font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;">Continue</button>
</div>
</div>
</x-dc>
