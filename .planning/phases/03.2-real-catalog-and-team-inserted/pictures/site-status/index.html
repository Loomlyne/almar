<!doctype html>
<!--
  Plan 03.2-05 Task 1: static mock of the site status line, for the owner's signature. Not app code.
  Open with ?state=up|updating|failed|unavailable|savehint&lang=en|ar|es. Values from tokens.json (dense dashboard).
  The shell (header, rail, menu button) copies app/dashboard/(ops)/ops-shell.tsx; only the status line and the
  Save hint are new.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMAR · site status line (03.2-05)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Questa"; src: url("../../../../../brand/Font/questa-webfont/2-Questa_Regular.woff") format("woff"); font-weight: 400; }
  @font-face { font-family: "Lato"; src: url("../../../../../brand/Font/lato/Lato-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Lato"; src: url("../../../../../brand/Font/lato/Lato-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --ivory: #fffaf0; --surface: #ffffff; --teal: #1f3b40; --teal-tint: #d1dfe0; --gold: #d4ba8a;
    --ink: #262626; --muted: #63615f; --line: rgb(38 38 38 / 0.16); --error: #8f2d2d; --success: #1e6b45;
    --control: 44px; --sidebar: 240px;
    --display: "Questa", Georgia, serif; --body: "Lato", Arial, sans-serif;
  }
  [dir="rtl"] { --display: "Noto Naskh Arabic", "Questa", Georgia, serif; --body: "Noto Sans Arabic", "Lato", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.43; min-height: 100vh; }
  [dir="rtl"] body { line-height: 1.63; }
  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  header { position: sticky; top: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: var(--control);
    border-bottom: 1px solid var(--line); background: var(--ivory); padding: 4px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: var(--control); color: var(--teal); text-decoration: none; min-width: 0; }
  .brand img { display: block; width: 140px; aspect-ratio: 2 / 1; object-fit: contain; object-position: left; }
  [dir="rtl"] .brand img { object-position: right; }
  .brand .name { display: none; font-family: var(--display); font-size: 14px; text-transform: uppercase; letter-spacing: 0.12em; white-space: nowrap; }
  [dir="rtl"] .brand .name { text-transform: none; letter-spacing: 0; }
  .spacer { flex: 1 1 auto; }
  .menu { display: inline-flex; width: var(--control); height: var(--control); align-items: center; justify-content: center; border: 1px solid var(--line);
    background: var(--surface); color: var(--teal); padding: 0; flex-shrink: 0; }

  /* The new part: the site status line. */
  .status { display: flex; align-items: center; gap: 8px; min-height: var(--control); font-size: 14px; color: var(--ink); white-space: nowrap; }
  .status .mark { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; }
  .status .sep { color: var(--muted); }
  .status time { font-variant-numeric: tabular-nums; }
  .status.failed .text { color: var(--error); }
  .status.unavailable { color: var(--muted); }
  .try { display: inline-flex; align-items: center; min-height: var(--control); padding: 0 8px; margin-inline-start: -8px; border: 1px solid transparent;
    background: transparent; color: var(--teal); font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--gold);
    text-decoration-thickness: 1px; text-underline-offset: 4px; }

  /* Phone: the line takes its own row under the logo, so it never runs into the menu button. */
  @media (max-width: 639px) {
    .status { order: 3; flex-basis: calc(100% + 32px); flex-wrap: wrap; column-gap: 8px; row-gap: 0; white-space: normal; border-top: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
    .spacer { display: none; }
    .brand { flex: 1 1 auto; }
  }

  .body { display: flex; flex: 1 1 auto; align-items: stretch; min-width: 0; }
  nav { display: none; flex-direction: column; width: var(--sidebar); flex-shrink: 0; background: var(--surface); border-inline-end: 1px solid var(--line); padding: 8px; }
  nav a, nav .group { display: flex; align-items: center; min-height: var(--control); padding: 0 8px; color: var(--ink); text-decoration: none; }
  nav .group { justify-content: space-between; color: var(--teal); }
  nav .kids { margin-inline-start: 16px; border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; }
  nav .kids a { padding-inline-start: 16px; }
  nav .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; min-height: var(--control); display: flex; align-items: center; padding: 0 8px; }
  [dir="rtl"] nav .kicker { text-transform: none; letter-spacing: 0; }
  nav a.current { background: var(--teal-tint); color: var(--teal); }
  main { flex: 1 1 auto; min-width: 0; padding: 16px; }
  h1 { margin: 0 0 16px; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.2; color: var(--teal); }
  [dir="rtl"] h1 { line-height: 1.4; }
  .ghost { height: 56px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; }

  @media (min-width: 1280px) {
    nav { display: flex; }
    .menu { display: none; }
    .brand .name { display: inline; }
  }

  /* Save hint (published item): the action row of the edit panel, with one muted line under it. */
  .panel { max-width: 640px; border: 1px solid var(--line); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; background: var(--teal-tint); color: var(--teal); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: var(--control); padding: 0 24px; border: 1px solid var(--teal); font: inherit;
    font-size: 14px; text-transform: uppercase; letter-spacing: 0.12em; cursor: pointer; }
  [dir="rtl"] .btn { text-transform: none; letter-spacing: 0; }
  .btn.primary { background: var(--teal); color: var(--ivory); }
  .btn.secondary { background: transparent; color: var(--teal); }
  .hint { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
const COPY = {
  en: {
    dashboard: "Dashboard", menu: "Menu",
    upToDate: "Up to date", updatingSince: "Updating since", failed: "Update failed", tryAgain: "Try again",
    unavailable: "Status unavailable",
    saveAndUpdate: "Save and update site", unpublish: "Unpublish", published: "Published",
    publishedSaveHint: "Saving updates the public site in a few minutes",
    rail: { home: "Home", bookings: "Bookings", customers: "Customers", calendar: "Calendar", catalog: "Catalog",
      destinations: "Destinations", stays: "Stays", experiences: "Experiences & Services", packages: "Packages",
      content: "Content", pages: "Pages", blog: "Blog", team: "Team", legal: "Legal", media: "Media",
      settings: "Settings", profile: "Profile" },
  },
  ar: {
    dashboard: "لوحة التحكم", menu: "القائمة",
    upToDate: "الموقع محدَّث", updatingSince: "جارٍ التحديث منذ", failed: "تعذّر التحديث", tryAgain: "حاول مرة أخرى",
    unavailable: "الحالة غير متاحة",
    saveAndUpdate: "حفظ وتحديث الموقع", unpublish: "إلغاء النشر", published: "منشور",
    publishedSaveHint: "الحفظ يحدّث الموقع العام خلال دقائق قليلة",
    rail: { home: "الرئيسية", bookings: "الحجوزات", customers: "العملاء", calendar: "التقويم", catalog: "الكتالوج",
      destinations: "الوجهات", stays: "الإقامات", experiences: "التجارب والخدمات", packages: "الباقات",
      content: "المحتوى", pages: "الصفحات", blog: "المدونة", team: "الفريق", legal: "القانوني", media: "الوسائط",
      settings: "الإعدادات", profile: "الملف" },
  },
  es: {
    dashboard: "Panel", menu: "Menú",
    upToDate: "Sitio al día", updatingSince: "Actualizando desde las", failed: "Falló la actualización", tryAgain: "Intentar de nuevo",
    unavailable: "Estado no disponible",
    saveAndUpdate: "Guardar y actualizar el sitio", unpublish: "Dejar de publicar", published: "Publicado",
    publishedSaveHint: "Al guardar, el sitio público se actualiza en unos minutos",
    rail: { home: "Inicio", bookings: "Reservas", customers: "Clientes", calendar: "Calendario", catalog: "Catálogo",
      destinations: "Destinos", stays: "Estancias", experiences: "Experiencias y servicios", packages: "Paquetes",
      content: "Contenido", pages: "Páginas", blog: "Blog", team: "Equipo", legal: "Legal", media: "Medios",
      settings: "Ajustes", profile: "Perfil" },
  },
};

const MARK = {
  up: '<svg class="mark" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#1e6b45" stroke-width="1.5"><path d="M3 8.5l3 3 7-7"/></svg>',
  updating: '<svg class="mark" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="6" stroke="rgb(38 38 38 / 0.16)"/><path d="M8 2a6 6 0 0 1 6 6" stroke="#1f3b40"/></svg>',
  failed: '<svg class="mark" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8f2d2d" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5v4.5M8 10.75v.75"/></svg>',
};

const q = new URLSearchParams(location.search);
const state = q.get("state") || "up";
const lang = q.get("lang") || "en";
const c = COPY[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

const t = (hhmm) => `<time dir="ltr">${hhmm}</time>`;
function statusLine(s) {
  if (s === "up" || s === "savehint")
    return `<div class="status" role="status">${MARK.up}<span class="text">${c.upToDate}</span><span class="sep">·</span>${t("14:05")}</div>`;
  if (s === "updating")
    return `<div class="status" role="status">${MARK.updating}<span class="text">${c.updatingSince} ${t("14:02")}</span></div>`;
  if (s === "failed")
    return `<div class="status failed" role="status">${MARK.failed}<span class="text">${c.failed}</span><span class="sep">·</span>${t("14:30")}<span class="sep">·</span><button class="try" type="button">${c.tryAgain}</button></div>`;
  return `<div class="status unavailable" role="status"><span class="text">${c.unavailable}</span></div>`;
}

const r = c.rail;
const nav = `
  <nav aria-label="${c.dashboard}">
    <a href="#">${r.home}</a><a href="#">${r.bookings}</a><a href="#">${r.customers}</a><a href="#">${r.calendar}</a>
    <div class="group"><span>${r.catalog}</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></div>
    <div class="kids"><a href="#">${r.destinations}</a><a class="current" href="#">${r.stays}</a><a href="#">${r.experiences}</a><a href="#">${r.packages}</a></div>
    <p class="kicker">${r.content}</p>
    <div class="kids"><a href="#">${r.pages}</a><a href="#">${r.blog}</a><a href="#">${r.team}</a><a href="#">${r.legal}</a><a href="#">${r.media}</a></div>
    <a href="#">${r.settings}</a><a href="#">${r.profile}</a>
  </nav>`;

const mainStatus = `<h1>${r.stays}</h1><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>`;
const mainHint = `<h1>${r.stays}</h1>
  <div class="panel">
    <span class="chip">${c.published}</span>
    <div class="ghost" style="margin:0"></div>
    <div class="ghost" style="margin:0;height:112px"></div>
    <div class="row"><button class="btn primary" type="button">${c.saveAndUpdate}</button><button class="btn secondary" type="button">${c.unpublish}</button></div>
    <p class="hint">${c.publishedSaveHint}</p>
  </div>`;

document.getElementById("app").innerHTML = `
  <header>
    <a class="brand" href="#"><img alt="ALMAR" src="../../../../../brand/Logo Typography/Stacked_Charcoal.svg"><span class="name">${c.dashboard}</span></a>
    <span class="spacer"></span>
    ${statusLine(state)}
    <button class="menu" type="button" aria-label="${c.menu}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="body">${nav}<main id="content">${state === "savehint" ? mainHint : mainStatus}</main></div>`;
</script>
</body>
</html>
