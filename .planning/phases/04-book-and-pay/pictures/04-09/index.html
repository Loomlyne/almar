<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMAR 04-09 pictures: dashboard bookings and money settings</title>
<style>
:root{
  --color-ivory:#fffaf0;--color-surface:#ffffff;--color-teal:#1f3b40;--color-teal-hover:#1b3438;--color-teal-press:#182d31;
  --color-teal-tint:#d1dfe0;--color-gold:#d4ba8a;--color-ink:#262626;--color-muted:#63615f;--color-line:rgb(38 38 38 / 0.16);
  --color-error:#8f2d2d;--color-success:#1e6b45;--color-warning:#8a3b12;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;
  --control:44px;--chip:40px;--chip-dense:24px;--row:56px;--dock:88px;--search:200px;
  --container-dialog:480px;--container-column:1240px;--container-calendar:760px;
  --radius-control:0;--radius-overlay:0;
  --shadow-lg:0 28px 56px -16px rgb(10 9 7 / 0.28),0 10px 20px -10px rgb(10 9 7 / 0.12);
  --shadow-selected:inset 0 0 0 2px var(--color-teal);
  --face-display:Georgia,"Times New Roman",serif;
  --face-body:"Lato",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --tracking-kicker:0.12em;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:#ece8df;color:var(--color-ink);font-family:var(--face-body);font-size:14px}
/* ---------- page chrome (review page only, not product UI) ---------- */
#top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:10px 20px;background:var(--color-teal);color:var(--color-ivory)}
#top h1{font:400 18px var(--face-display);margin:0;margin-inline-end:auto}
#top .grp{display:flex;align-items:center;gap:6px}
#top .grp span.l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-inline-end:4px}
#top button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(255,250,240,.5);background:transparent;color:var(--color-ivory);cursor:pointer}
#top button[aria-pressed=true]{background:var(--color-ivory);color:var(--color-teal);border-color:var(--color-ivory)}
#wrap{display:flex;align-items:flex-start}
#index{position:sticky;top:52px;align-self:flex-start;width:268px;flex:none;height:calc(100vh - 52px);overflow:auto;background:var(--color-ivory);border-inline-end:1px solid var(--color-line);padding:14px 14px 40px;font-size:13px}
#index h2{font:400 12px var(--face-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-muted);margin:16px 0 4px}
#index a{display:block;color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:3px;padding:2px 0}
#index a.st{margin-inline-start:12px;text-decoration:none;color:var(--color-ink)}
#index a.st:hover{text-decoration:underline;text-decoration-color:var(--color-gold)}
#main{flex:1;min-width:0;padding:20px 24px 80px}
.banner{background:var(--color-ivory);border:1px solid var(--color-gold);padding:10px 14px;margin-bottom:20px;font-size:13px;line-height:1.5}
.grpbox{margin:0 0 44px}
.grpbox>h2{font:400 22px var(--face-display);color:var(--color-teal);margin:0 0 4px}
.grpbox>.q{margin:0 0 4px;font-size:14px;line-height:1.5;max-width:900px}
.grpbox>.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--color-teal);color:var(--color-teal);padding:2px 8px;margin-bottom:8px}
.fr{margin:14px 0 26px}
.cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.cap code{font:600 13px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);padding:2px 6px}
.cap .opt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-teal)}
.cap .opt.rec{font-weight:700}
.cap .rules{font-size:12px;color:var(--color-muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.fw{position:relative;overflow:hidden;border:1px solid var(--color-line);background:var(--color-ivory)}
.stub{border:1px dashed var(--color-muted);padding:10px 14px;font-size:13px;background:#fff}
.stub a{color:var(--color-teal)}
/* ---------- product frame ---------- */
.frame{container-type:inline-size;position:relative;transform-origin:top left;background:var(--color-ivory);color:var(--color-ink);font-family:var(--face-body);font-size:14px;line-height:1.43}
.inner{--px:16px;--py:24px;padding:var(--py) var(--px) calc(var(--py) + 16px)}
.frame[dir=rtl]{font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.63;text-align:start}
.frame[dir=rtl] .disp{font-family:"Noto Naskh Arabic","Noto Sans Arabic",var(--face-display);line-height:1.5}
.disp{font-family:var(--face-display);font-weight:400;color:var(--color-teal);margin:0}
.h1{font-size:32px;line-height:1.2}.h2{font-size:20px;line-height:1.3}
.cap12{font-size:12px;line-height:1.5}
.muted{color:var(--color-muted)}
.kick{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted)}
.frame[dir=rtl] .kick,.frame[dir=rtl] .btn-up{text-transform:none;letter-spacing:0}
.stack{display:flex;flex-direction:column}.g1{gap:4px}.g2{gap:8px}.g4{gap:16px}.g6{gap:24px}
.row{display:flex;flex-wrap:wrap;align-items:center}.gx2{gap:8px}.gx4{gap:16px}
.sec{border-top:1px solid var(--color-line);padding-top:16px;margin-top:24px;display:flex;flex-direction:column;gap:8px}
.sec>.disp.h2{margin-bottom:4px}
/* buttons (components/ui/button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;height:var(--control);padding:0 24px;border:1px solid transparent;font:inherit;font-size:14px;cursor:pointer;background:transparent}
.btn-up{text-transform:uppercase;letter-spacing:.12em}
.btn-primary{background:var(--color-teal);color:var(--color-ivory);border-color:var(--color-teal)}
.btn-secondary{background:transparent;color:var(--color-teal);border-color:var(--color-teal)}
.btn-ghost{background:transparent;color:var(--color-teal);border-color:transparent;text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px}
.btn-danger{background:transparent;color:var(--color-ink);border-color:var(--color-error)}
.btn:disabled{background:var(--color-ivory);border-color:var(--color-line);color:var(--color-muted);cursor:default;text-decoration:none}
.btn.sm{padding:0 16px}
.link{color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px;background:none;border:0;padding:0;font:inherit;cursor:pointer;min-height:var(--control);display:inline-flex;align-items:center;gap:8px}
/* chips */
.chip{display:inline-flex;align-items:center;height:var(--chip);padding:0 16px;border:1px solid var(--color-muted);color:var(--color-ink);background:transparent;white-space:nowrap}
.chip.dense{height:var(--chip-dense);padding:0 8px;font-size:12px}
.chip.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* fields */
.field{display:grid;gap:8px;max-width:384px;width:100%}
.field.wide{max-width:none}
.field>label,.field>.lb{font-size:14px;color:var(--color-ink)}
.inp{display:block;width:100%;min-height:var(--control);border:1px solid var(--color-ink);background:var(--color-surface);padding:8px 16px;font:inherit;font-size:14px;color:var(--color-ink);text-align:start}
.inp.ta{min-height:96px}
.inp.bad{border-color:var(--color-error)}
.inp.ph{color:var(--color-muted)}
.inp.dis{background:var(--color-ivory);color:var(--color-muted);border-color:var(--color-line)}
.hint{margin:0;font-size:14px;color:var(--color-ink)}
.hint.m{color:var(--color-muted);font-size:12px}
.err{margin:0;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--color-error)}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:var(--control);min-width:96px;padding:0 16px;border:1px solid var(--color-muted);background:var(--color-surface);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-ink)}
.frame[dir=rtl] .sel{text-transform:none;letter-spacing:0}
.chk{display:flex;align-items:center;gap:12px;min-height:var(--control)}
.chk i{width:20px;height:20px;border:1px solid var(--color-ink);background:var(--color-surface);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal)}
.chk i.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* blocks */
.block{border:1px solid var(--color-line);background:var(--color-surface);padding:16px}
.attn{border:1px solid var(--color-error);border-inline-start-width:4px;background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.attn .t{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--color-error)}
.attn p{margin:0}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 16px;margin:0}
.dl dt{color:var(--color-muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.dl .tot{font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--color-line)}
.mrow.b{font-weight:700}
.cols2{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.cols2{grid-template-columns:1fr 1fr}.tbl{display:table!important}.cards{display:none!important}.inner{--px:32px;--py:32px}}
.tbl{display:none;width:100%;border-collapse:collapse}
.tbl th{height:var(--row);padding:0 8px;text-align:start;font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted);border-bottom:1px solid var(--color-line)}
.frame[dir=rtl] .tbl th{text-transform:none;letter-spacing:0}
.tbl td{padding:10px 8px;vertical-align:top;border-bottom:1px solid var(--color-line)}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.cards li{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:6px}
.strike{text-decoration:line-through;color:var(--color-muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--color-ink);margin-top:4px}
.flags span{border-inline-start:2px solid var(--color-ink);padding-inline-start:6px}
.flags span.e{border-color:var(--color-error);color:var(--color-error)}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--color-line)}
.ev time{color:var(--color-muted);white-space:nowrap}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--color-line);padding-bottom:8px;margin-top:24px}
.tabs .btn[aria-pressed=true]{text-decoration-thickness:3px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin:16px 0 24px}
.miss{background:#fde8e8;border:2px solid #c00000;color:#8b0000;font:600 12px ui-monospace,Menlo,monospace;padding:8px 10px;margin:8px 0;direction:ltr;text-align:left}
.empty{border:1px solid var(--color-line);background:var(--color-surface);padding:32px 16px;text-align:center;color:var(--color-muted)}
/* dialogs (components/ui/dialog.tsx) */
.dlgwrap{position:relative;overflow:hidden;min-height:520px;margin:calc(-1*var(--py)) calc(-1*var(--px)) calc(-1*var(--py) - 16px)}
.dlgwrap .behind{position:absolute;inset:0;overflow:hidden;padding:var(--py) var(--px)}
.dlgwrap .scrim{position:absolute;inset:0;background:rgb(38 38 38 / .4)}
.dlgpos{position:relative;padding:32px 16px 40px}
.dlg{width:100%;max-width:var(--container-dialog);margin-inline:auto;background:var(--color-surface);padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.dlg.wide{max-width:var(--container-column)}
.dlg .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dlg .hd .xb{width:var(--control);height:var(--control);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal);flex:none}
.dlg .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.dlg p.s{margin:0;font-size:16px;line-height:1.5}
.frame[dir=rtl] .dlg p.s{line-height:1.7}
.dlg ul.sent{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.dlg ul.sent li{font-size:16px;border-inline-start:2px solid var(--color-gold);padding-inline-start:12px}
svg.i{width:16px;height:16px;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.two{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.two{grid-template-columns:1fr 1fr}}
.tr-box{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:16px}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:8px}
.ok{color:var(--color-success)}

function mkItem(i, o) {
  return Object.assign({ ref: refOf(i), status: "awaiting_payment", test: false, arrive: `2026-${11 + (i % 2)}-${String(3 + (i % 20)).padStart(2, "0")}`, leave: `2026-${11 + (i % 2)}-${String(6 + (i % 20)).padStart(2, "0")}`, guests: 1 + (i % 4), grand: GRAND, paid: 0, wo: 0, deadline: null, flags: {}, reason: null }, o);

function refOf(i) { const al = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let x = (i * 7919 + 104729) >>> 0, s = ""; for (let k = 0; k < 6; k++) { s += al[x % al.length]; x = Math.imul(x, 1103515245) + 12345 >>> 0; x = x >>> 3; } return "ALMAR-" + s; }

function manyItems() {
  const items = [];
  const D = (n) => `2026-10-${String(n).padStart(2, "0")} 17:30`;
  items.push(mkItem(1, { reason: "deadline_passed_part_paid", status: "awaiting_payment", paid: 200000, deadline: D(18), flags: { needs_attention: true, part_received: true, deadline_passed: true } }));
  items.push(mkItem(2, { reason: "paid_after_expiry", status: "expired", paid: 500000, flags: { needs_attention: true } }));
  const order = ["awaiting_payment", "awaiting_payment", "awaiting_payment", "deposit_paid", "paid_in_full", "confirmed", "completed", "cancelled", "expired", "held"];
  for (let i = 3; i <= 30; i++) {
    const s = order[(i - 3) % order.length];
    const paid = s === "deposit_paid" ? 500000 : ["paid_in_full", "confirmed", "completed"].includes(s) ? GRAND : 0;
    items.push(mkItem(i, { status: s, paid, deadline: s === "awaiting_payment" ? D(19 + ((i - 3) % 3) + 1) : null, test: i % 9 === 0 }));

/* ---------- render ---------- */
const rendered = new Set();
function frameHTML(id, tag) {
  const s = STATES[id];
  const anchor = rendered.has(id) ? "" : ` id="s-${id}"`;
  rendered.add(id);
  const rules = s.rules ? `<span class="rules">${esc(s.rules())}</span>` : "";
  return `<div class="fr"${anchor}><div class="cap"><code>${id}</code>${tag ? `<span class="opt${tag.startsWith("A") ? " rec" : ""}">${esc(tag)}</span>` : ""}${rules}</div><div class="fw" data-w="${WIDTH}"><div class="frame" style="width:${WIDTH}px" lang="${LOC}" dir="${LOC === "ar" ? "rtl" : "ltr"}"><div class="inner">${s.fn()}</div></div></div></div>`;
}
function render() {
  rendered.clear();
  let html = `<div class="banner"><strong>04-09 pictures for signature.</strong> Every visible product string is copied verbatim from lib/copy/ops-bookings.ts, ops-money.ts and the VAT / deposit / FX / Save keys of the settings copy, in EN, AR (RTL) and ES (usted). All amounts are example figures in AED, not prices, rates or percentages ("[00]" stands for a rate). Names and banks are bracket placeholders. The only IBAN is the documentation example. Red boxes marked MISSING COPY show a string the plan needs that is not in the copy files yet. Nothing here is wired.</div>`;
  for (const g of GROUPS) {
    let inner = "";
    if (g.sig === "choice") {
      if (CMP) inner = `<div class="cmp">${g.opts.map(([id, tag]) => frameHTML(id, tag)).join("")}</div>`;
      else inner = g.opts.map(([id, tag]) => (rendered.has(id) ? `<div class="stub"><code>${id}</code> (${esc(tag)}) is the same picture as above: <a href="#s-${id}">jump to it</a>. Turn Compare on to see both options side by side.</div>` : frameHTML(id, tag))).join("");
    } else {
      inner = g.ids.map((id) => (rendered.has(id) ? `<div class="stub"><code>${id}</code> already drawn: <a href="#s-${id}">jump to it</a>.</div>` : frameHTML(id))).join("");
    }
    html += `<section class="grpbox" id="g-${g.id}"><h2>${esc(g.h)}</h2>${g.sig === "choice" ? '<span class="tag">Owner signature: choose</span>' : g.sig === "approve" ? '<span class="tag">Owner signature: approve or change</span>' : ""}<p class="q">${esc(g.q)}</p>${inner}</section>`;
  }
  document.getElementById("main").innerHTML = html;
  fit();
}
function fit() {
  const mainW = document.getElementById("main").clientWidth - 48;
  document.querySelectorAll(".fw").forEach((fw) => {
    const f = fw.firstElementChild, cmp = fw.closest(".cmp");
    const avail = cmp ? (mainW - 20) / 2 : mainW;
    const sc = Math.min(1, avail / WIDTH);
    fw.style.width = Math.round(WIDTH * sc) + 2 + "px";
    f.style.transform = `scale(${sc})`;
    fw.style.height = Math.ceil(f.offsetHeight * sc) + 2 + "px";
  });
}
function buildIndex() {
  let h = "";
  for (const g of GROUPS) {
    h += `<h2>${esc(g.h.split(" · ")[0])}</h2><a href="#g-${g.id}">${esc(g.h.split(" · ").slice(1).join(" · ") || g.h)}</a>`;
    const ids = g.sig === "choice" ? g.opts.map((o) => o[0]) : g.ids;
    h += ids.map((id) => `<a class="st" href="#s-${id}">${id}</a>`).join("");
  }
  document.getElementById("index").innerHTML = h;
}
function setPressed() {
  document.querySelectorAll("#top [data-loc]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.loc === LOC));
  document.querySelectorAll("#top [data-w]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.w === WIDTH));
  document.getElementById("cmp").setAttribute("aria-pressed", CMP);
}
document.querySelectorAll("#top [data-loc]").forEach((b) => b.addEventListener("click", () => { LOC = b.dataset.loc; setPressed(); render(); }));
document.querySelectorAll("#top [data-w]").forEach((b) => b.addEventListener("click", () => { WIDTH = +b.dataset.w; setPressed(); render(); }));
document.getElementById("cmp").addEventListener("click", () => { CMP = !CMP; setPressed(); render(); });
window.addEventListener("resize", fit);
window.addEventListener("load", () => { fit(); setTimeout(fit, 400); });
buildIndex(); setPressed(); render();

</script></body></html>
