<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMAR 04-03 pictures: guest booking trip</title>
<style>
:root{
  --color-ivory:#fffaf0;--color-surface:#ffffff;--color-teal:#1f3b40;--color-teal-hover:#1b3438;--color-teal-press:#182d31;
  --color-teal-tint:#d1dfe0;--color-gold:#d4ba8a;--color-ink:#262626;--color-muted:#63615f;--color-line:rgb(38 38 38 / 0.16);
  --color-error:#8f2d2d;--color-success:#1e6b45;--color-warning:#8a3b12;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;
  --control:44px;--chip:40px;--chip-dense:24px;--row:56px;--dock:88px;--search:200px;
  --container-dialog:480px;--container-column:1240px;--container-calendar:760px;
  --radius-control:0;--radius-overlay:0;
  --shadow-lg:0 28px 56px -16px rgb(10 9 7 / 0.28),0 10px 20px -10px rgb(10 9 7 / 0.12);
  --shadow-selected:inset 0 0 0 2px var(--color-teal);
  --face-display:Georgia,"Times New Roman",serif;
  --face-body:"Lato",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --tracking-kicker:0.12em;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:#ece8df;color:var(--color-ink);font-family:var(--face-body);font-size:14px}
/* ---------- page chrome (review page only, not product UI) ---------- */
#top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:10px 20px;background:var(--color-teal);color:var(--color-ivory)}
#top h1{font:400 18px var(--face-display);margin:0;margin-inline-end:auto}
#top .grp{display:flex;align-items:center;gap:6px}
#top .grp span.l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-inline-end:4px}
#top button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(255,250,240,.5);background:transparent;color:var(--color-ivory);cursor:pointer}
#top button[aria-pressed=true]{background:var(--color-ivory);color:var(--color-teal);border-color:var(--color-ivory)}
#wrap{display:flex;align-items:flex-start}
#index{position:sticky;top:52px;align-self:flex-start;width:268px;flex:none;height:calc(100vh - 52px);overflow:auto;background:var(--color-ivory);border-inline-end:1px solid var(--color-line);padding:14px 14px 40px;font-size:13px}
#index h2{font:400 12px var(--face-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-muted);margin:16px 0 4px}
#index a{display:block;color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:3px;padding:2px 0}
#index a.st{margin-inline-start:12px;text-decoration:none;color:var(--color-ink)}
#index a.st:hover{text-decoration:underline;text-decoration-color:var(--color-gold)}
#main{flex:1;min-width:0;padding:20px 24px 80px}
.banner{background:var(--color-ivory);border:1px solid var(--color-gold);padding:10px 14px;margin-bottom:20px;font-size:13px;line-height:1.5}
.grpbox{margin:0 0 44px}
.grpbox>h2{font:400 22px var(--face-display);color:var(--color-teal);margin:0 0 4px}
.grpbox>.q{margin:0 0 4px;font-size:14px;line-height:1.5;max-width:900px}
.grpbox>.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--color-teal);color:var(--color-teal);padding:2px 8px;margin-bottom:8px}
.fr{margin:14px 0 26px}
.cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.cap code{font:600 13px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);padding:2px 6px}
.cap .opt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-teal)}
.cap .opt.rec{font-weight:700}
.cap .rules{font-size:12px;color:var(--color-muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.fw{position:relative;overflow:hidden;border:1px solid var(--color-line);background:var(--color-ivory)}
.stub{border:1px dashed var(--color-muted);padding:10px 14px;font-size:13px;background:#fff}
.stub a{color:var(--color-teal)}
/* ---------- product frame ---------- */
.frame{container-type:inline-size;position:relative;transform-origin:top left;background:var(--color-ivory);color:var(--color-ink);font-family:var(--face-body);font-size:14px;line-height:1.43}
.inner{--px:16px;--py:24px;padding:var(--py) var(--px) calc(var(--py) + 16px)}
.frame[dir=rtl]{font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.63;text-align:start}
.frame[dir=rtl] .disp{font-family:"Noto Naskh Arabic","Noto Sans Arabic",var(--face-display);line-height:1.5}
.disp{font-family:var(--face-display);font-weight:400;color:var(--color-teal);margin:0}
.h1{font-size:32px;line-height:1.2}.h2{font-size:20px;line-height:1.3}
.cap12{font-size:12px;line-height:1.5}
.muted{color:var(--color-muted)}
.kick{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted)}
.frame[dir=rtl] .kick,.frame[dir=rtl] .btn-up{text-transform:none;letter-spacing:0}
.stack{display:flex;flex-direction:column}.g1{gap:4px}.g2{gap:8px}.g4{gap:16px}.g6{gap:24px}
.row{display:flex;flex-wrap:wrap;align-items:center}.gx2{gap:8px}.gx4{gap:16px}
.sec{border-top:1px solid var(--color-line);padding-top:16px;margin-top:24px;display:flex;flex-direction:column;gap:8px}
.sec>.disp.h2{margin-bottom:4px}
/* buttons (components/ui/button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;height:var(--control);padding:0 24px;border:1px solid transparent;font:inherit;font-size:14px;cursor:pointer;background:transparent}
.btn-up{text-transform:uppercase;letter-spacing:.12em}
.btn-primary{background:var(--color-teal);color:var(--color-ivory);border-color:var(--color-teal)}
.btn-secondary{background:transparent;color:var(--color-teal);border-color:var(--color-teal)}
.btn-ghost{background:transparent;color:var(--color-teal);border-color:transparent;text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px}
.btn-danger{background:transparent;color:var(--color-ink);border-color:var(--color-error)}
.btn:disabled{background:var(--color-ivory);border-color:var(--color-line);color:var(--color-muted);cursor:default;text-decoration:none}
.btn.sm{padding:0 16px}
.link{color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px;background:none;border:0;padding:0;font:inherit;cursor:pointer;min-height:var(--control);display:inline-flex;align-items:center;gap:8px}
/* chips */
.chip{display:inline-flex;align-items:center;height:var(--chip);padding:0 16px;border:1px solid var(--color-muted);color:var(--color-ink);background:transparent;white-space:nowrap}
.chip.dense{height:var(--chip-dense);padding:0 8px;font-size:12px}
.chip.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* fields */
.field{display:grid;gap:8px;max-width:384px;width:100%}
.field.wide{max-width:none}
.field>label,.field>.lb{font-size:14px;color:var(--color-ink)}
.inp{display:block;width:100%;min-height:var(--control);border:1px solid var(--color-ink);background:var(--color-surface);padding:8px 16px;font:inherit;font-size:14px;color:var(--color-ink);text-align:start}
.inp.ta{min-height:96px}
.inp.bad{border-color:var(--color-error)}
.inp.ph{color:var(--color-muted)}
.inp.dis{background:var(--color-ivory);color:var(--color-muted);border-color:var(--color-line)}
.hint{margin:0;font-size:14px;color:var(--color-ink)}
.hint.m{color:var(--color-muted);font-size:12px}
.err{margin:0;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--color-error)}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:var(--control);min-width:96px;padding:0 16px;border:1px solid var(--color-muted);background:var(--color-surface);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-ink)}
.frame[dir=rtl] .sel{text-transform:none;letter-spacing:0}
.chk{display:flex;align-items:center;gap:12px;min-height:var(--control)}
.chk i{width:20px;height:20px;border:1px solid var(--color-ink);background:var(--color-surface);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal)}
.chk i.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* blocks */
.block{border:1px solid var(--color-line);background:var(--color-surface);padding:16px}
.attn{border:1px solid var(--color-error);border-inline-start-width:4px;background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.attn .t{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--color-error)}
.attn p{margin:0}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 16px;margin:0}
.dl dt{color:var(--color-muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.dl .tot{font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--color-line)}
.mrow.b{font-weight:700}
.cols2{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.cols2{grid-template-columns:1fr 1fr}.tbl{display:table!important}.cards{display:none!important}.inner{--px:32px;--py:32px}}
.tbl{display:none;width:100%;border-collapse:collapse}
.tbl th{height:var(--row);padding:0 8px;text-align:start;font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted);border-bottom:1px solid var(--color-line)}
.frame[dir=rtl] .tbl th{text-transform:none;letter-spacing:0}
.tbl td{padding:10px 8px;vertical-align:top;border-bottom:1px solid var(--color-line)}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.cards li{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:6px}
.strike{text-decoration:line-through;color:var(--color-muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--color-ink);margin-top:4px}
.flags span{border-inline-start:2px solid var(--color-ink);padding-inline-start:6px}
.flags span.e{border-color:var(--color-error);color:var(--color-error)}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--color-line)}
.ev time{color:var(--color-muted);white-space:nowrap}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--color-line);padding-bottom:8px;margin-top:24px}
.tabs .btn[aria-pressed=true]{text-decoration-thickness:3px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin:16px 0 24px}
.miss{background:#fde8e8;border:2px solid #c00000;color:#8b0000;font:600 12px ui-monospace,Menlo,monospace;padding:8px 10px;margin:8px 0;direction:ltr;text-align:left}
.empty{border:1px solid var(--color-line);background:var(--color-surface);padding:32px 16px;text-align:center;color:var(--color-muted)}
/* dialogs (components/ui/dialog.tsx) */
.dlgwrap{position:relative;overflow:hidden;min-height:520px;margin:calc(-1*var(--py)) calc(-1*var(--px)) calc(-1*var(--py) - 16px)}
.dlgwrap .behind{position:absolute;inset:0;overflow:hidden;padding:var(--py) var(--px)}
.dlgwrap .scrim{position:absolute;inset:0;background:rgb(38 38 38 / .4)}
.dlgpos{position:relative;padding:32px 16px 40px}
.dlg{width:100%;max-width:var(--container-dialog);margin-inline:auto;background:var(--color-surface);padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.dlg.wide{max-width:var(--container-column)}
.dlg .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dlg .hd .xb{width:var(--control);height:var(--control);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal);flex:none}
.dlg .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.dlg p.s{margin:0;font-size:16px;line-height:1.5}
.frame[dir=rtl] .dlg p.s{line-height:1.7}
.dlg ul.sent{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.dlg ul.sent li{font-size:16px;border-inline-start:2px solid var(--color-gold);padding-inline-start:12px}
svg.i{width:16px;height:16px;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.two{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.two{grid-template-columns:1fr 1fr}}
.tr-box{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:16px}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:8px}
.ok{color:var(--color-success)}

/* ---------- 04-03 additions ---------- */
:root{--action:56px;--bar:72px;--entry:64px;--mark:28px;--rail:400px}
.frame{--px:16px}
.page{max-width:var(--container-column);margin:0 auto}
.page>h1{margin-bottom:16px}
.b16{font-size:16px;line-height:1.5}
.frame[dir=rtl] .b16{line-height:1.7}
.d20{font-size:20px;line-height:1.3}.frame[dir=rtl] .d20{line-height:1.5}
.d32{font-size:32px;line-height:1.2}.frame[dir=rtl] .d32{line-height:1.4}
.d48{font-size:48px;line-height:1.1;letter-spacing:-0.02em}.frame[dir=rtl] .d48{line-height:1.3;letter-spacing:0}
.tnum{font-variant-numeric:tabular-nums}
.btn.wrap{height:auto;min-height:var(--control);padding-block:8px;text-align:center;white-space:normal}
.btn.lg{height:auto;min-height:var(--action);padding-inline:32px;padding-block:8px;text-align:center;white-space:normal}
.btn.wide{width:100%}
.btn.nopad{padding-inline:12px}
.btn:disabled.btn-primary,.btn:disabled.btn-secondary{background:var(--color-ivory);border-color:var(--color-line);color:var(--color-muted)}
.sp{width:14px;height:14px;border:1.5px solid currentColor;flex:none}
.ic{width:20px;height:20px;flex:none}.ic16{width:16px;height:16px;flex:none}
.frame[dir=rtl] .flip{transform:scaleX(-1)}
/* rail + layout */
.trip{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;margin-top:24px}
.railw .r-rail{display:none}
.railw .r-phone{display:block}
.r-phone ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.r-phone li{height:3px;background:var(--color-line)}.r-phone li.on{background:var(--color-teal)}
.r-phone p{margin:8px 0 0;font-size:12px;color:var(--color-muted)}
.r-rail ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--color-line)}
.r-rail li{padding-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:14px}
.r-rail li.done{color:var(--color-teal)}.r-rail li.cur{color:var(--color-teal);box-shadow:inset 0 -3px 0 var(--color-teal)}.r-rail li.up{color:var(--color-muted)}
.mk{width:var(--mark);height:var(--mark);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.done .mk{background:var(--color-teal);color:var(--color-ivory)}.cur .mk{border:1px solid var(--color-teal);color:var(--color-teal)}.up .mk{border:1px solid var(--color-muted);color:var(--color-muted)}
.r-rail .btn-ghost{height:var(--control);padding:0 8px}
.cartrail{width:100%;background:var(--color-surface);border:1px solid var(--color-line);padding:24px;display:flex;flex-direction:column;gap:16px}
.side.hidephone{display:none}
.phonedock{display:flex;align-items:center;gap:16px;height:var(--dock);padding:0 16px;border-top:1px solid var(--color-line);background:var(--color-ivory);margin:32px calc(-1*var(--px)) calc(-1*(var(--py) + 16px))}
.phonedock .sum{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.phonedock .sum>span{display:flex;flex-direction:column}
.frame[dir=rtl] .phonedock .sum .chv{transform:rotate(90deg)}
.phonedock .chv{transform:rotate(-90deg);color:var(--color-teal)}
.hide-phone{display:none}
@container (min-width:768px){
  .trip{grid-template-columns:minmax(0,1fr) var(--rail);align-items:start}
  .railw .r-rail{display:block}.railw .r-phone{display:none}
  .side.hidephone{display:block}
  .side .cartrail{position:sticky;top:24px}
  .phonedock{display:none}
  .hide-phone{display:inline-flex}
  .rowP,.incl-compact{display:none!important}.rowL,.incl-panel{display:flex!important}
  .staycard{grid-template-columns:280px 1fr!important}
}
.rowL,.incl-panel{display:none}
.cartrail .kick{margin:0}
.cartrail h3{margin:0}
.cartrail .hr{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--color-line);font-size:14px}
.cl{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.cl.rm{align-items:center;gap:12px}.cl.rm .nm{flex:1;min-width:0}
.rmb{width:var(--control);height:var(--control);display:inline-flex;align-items:center;justify-content:center;color:var(--color-muted);border:0;background:transparent}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:12px;border-top:1px solid var(--color-line);font-size:14px;font-variant-numeric:tabular-nums}
.tot.strong{border-top-color:var(--color-ink);font-size:20px;font-weight:700}
.img169{width:100%;aspect-ratio:16/9;background:var(--color-ivory);outline:1px solid rgb(38 38 38 / .1);outline-offset:-1px}
.sk{height:16px;background:var(--color-ivory)}
/* steps */
.step{display:flex;flex-direction:column;gap:24px}
.step>h2{margin:0}
.staycard{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.staycard .img169{aspect-ratio:4/3}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.oneline{display:flex;flex-wrap:wrap;gap:0 8px;align-items:center;margin:0}
/* reasons */
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reasons li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--color-error);border-inline-start-width:4px;background:var(--color-surface);padding:12px 16px}
.reasons li .ic{color:var(--color-error);margin-top:2px}
.reasons li .tx{display:flex;flex-direction:column;align-items:flex-start;gap:0;flex:1;min-width:0}
.reasons .link{min-height:32px}
.rcode{font:600 11px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);padding:1px 5px;direction:ltr;unicode-bidi:isolate;color:var(--color-ink);margin-bottom:2px}
/* add-ons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.btnlike{cursor:default}
.alist{display:flex;flex-direction:column;gap:12px}
.rowL,.rowP{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.rowL.added,.rowP.added{box-shadow:var(--shadow-selected)}
.rowL{align-items:center;gap:24px;padding:12px;padding-inline-end:24px}
.rowL .im{width:136px;aspect-ratio:4/3;flex:none;background:var(--color-ivory)}
.rowL .im.pic,.rowP .im.pic{outline:1px solid rgb(38 38 38 / .1);outline-offset:-1px}
.rowL .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.rowL .pr{width:152px;text-align:end;display:flex;flex-direction:column}
.rowL .ctl{width:136px;display:flex;justify-content:flex-end;flex:none}
.rowP{flex-wrap:wrap;align-items:center;gap:12px;padding:8px}
.rowP{display:flex}
.rowP .im{width:84px;height:84px;flex:none;background:var(--color-ivory)}
.rowP .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.rowP .full{flex-basis:100%;display:flex;justify-content:flex-end}
.tg{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--color-teal);height:var(--control);width:100%;background:var(--color-surface);color:var(--color-teal);font-size:14px;text-transform:uppercase;letter-spacing:.12em}
.frame[dir=rtl] .tg{text-transform:none;letter-spacing:0}
.tg.on{background:var(--color-teal);color:var(--color-ivory)}
.tg.sq{width:var(--control);font-size:20px;letter-spacing:0;line-height:1}
.stp{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.stp b{width:28px;text-align:center;font-size:16px}
.stp i{width:var(--control);height:var(--control);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--color-teal);color:var(--color-teal);background:var(--color-surface);font-style:normal;font-size:16px}
.stp i.off{border-color:var(--color-line);color:var(--color-muted)}

/* ---------- step rail + layout ---------- */
function stepRail(cur) {
  const names = [t("steps.stay"), t("steps.addons"), t("steps.travelers"), t("steps.pay")];
  const rail = names.map((nm, i) => {
    const n = i + 1, st = n < cur ? "done" : n === cur ? "cur" : "up";
    const chg = st === "done" ? btn("ghost", t("steps.change"), { cls: "sm", aria: `${C().steps.change} ${names[i].replace(/<[^>]+>/g, "")}` }) : "";
    return `<li class="${st}"${st === "cur" ? ' aria-current="step"' : ""}><span class="mk" aria-hidden="true">${st === "done" ? ic("check", 16) : n}</span><span>${nm}</span>${chg}</li>`;
  }).join("");
  const phone = `<ol aria-label="${esc(C().steps.label)}">${[1, 2, 3, 4].map((n) => `<li class="${n <= cur ? "on" : ""}"></li>`).join("")}</ol><p>${tv("steps.phone", { n: cur, name: names[cur - 1] })}</p>`;
  return `<div class="railw"><div class="r-rail"><ol aria-label="${esc(C().steps.label)}">${rail}</ol></div><div class="r-phone">${phone}</div></div>`;
}
function layout(step, main, cartOpts) {
  const dock = step < 4 ? phoneDock(cartOpts) : "";
  return `<div class="page"><h1 class="disp d32">${t("trip.title")}</h1>${stepRail(step)}<div class="trip"><div class="main">${main}</div><div class="side${step < 4 ? " hidephone" : ""}">${cart(cartOpts)}</div></div></div>${dock}`;
}

/* ---------- step 1: stay ---------- */
function stepStay(o = {}) {
  const list = o.reasons || [];
  return `<section class="step"><h2 class="disp d20">${t("trip.stepTitle.stay")}</h2>
    <div class="staycard"><div class="img169"></div><div class="stack g2"><p class="kick" style="margin:0">${esc(W().dest)}</p><h3 class="disp d20" style="margin:0">${esc(W().stay)}</h3><p style="margin:0">${dates()} · ${guests4()}</p><p class="muted" style="margin:0">${tp("cart.stay", NIGHTS)}</p>${lnk(t("summary.changeOnStay"))}</div></div>
    ${reasons(list, "quote", { live: "alert" })}
    <p class="oneline"><span>${t("summary.oneDestination")}</span>${lnk(t("summary.secondCity"))}</p>
    <div class="acts">${btn("primary", t("summary.continue"), { dis: o.disabled })}</div></section>`;
}

/* ---------- step 2: add-ons ---------- */
function addOnRow(it, size) {
  const a = C().addons, added = it.q > 0;
  const kind = it.kind === "experience" ? t("addons.kind.experience") : it.uae ? t("addons.kind.serviceUae") : t("addons.kind.service");
  const price = `${aed(20000)}`;
  const unit = t("addons.unit." + it.unit);
  let ctl;
  if (it.unit === "trip") ctl = size === "phone" ? `<span class="tg sq${added ? " on" : ""}">${added ? ic("check") : "+"}</span>` : `<span class="tg${added ? " on" : ""}">${added ? ic("check", 16) : ""}${added ? t("addons.added") : t("addons.add")}</span>`;
  else ctl = `<span class="stp"><i class="${it.q <= 0 ? "off" : ""}">−</i><b>${it.q}</b><i>+</i></span>`;
  const im = `<div class="im${it.img ? " pic" : ""}"></div>`;
  if (size === "phone") return `<article class="rowP${added ? " added" : ""}">${im}<div class="nm"><span class="cap12 muted kick">${kind}</span><h3 class="disp d20" style="margin:0">${esc(it.name)}</h3><span class="tnum">${price} <span class="cap12 muted">${unit}</span></span></div>${it.unit === "trip" ? ctl : `<div class="full">${ctl}</div>`}</article>`;
  return `<article class="rowL${added ? " added" : ""}">${im}<div class="nm"><span class="cap12 muted kick">${kind}</span><h3 class="disp d20" style="margin:0">${esc(it.name)}</h3></div><div class="pr"><span class="b16 tnum">${price}</span><span class="cap12 muted">${unit}</span></div><div class="ctl">${ctl}</div></article>`;
}
function stepAddons() {
  const items = [
    { name: W().pickup, kind: "service", uae: true, unit: "trip", q: 1, img: true },
    { name: W().a2, kind: "service", uae: true, unit: "trip", q: 0, img: true },
    { name: W().a3, kind: "experience", unit: "person", q: 2, img: true },
    { name: W().a4, kind: "service", unit: "night", q: 0, img: false },
  ];
  const chips = ["all", "experiences", "services"].map((k, i) => `<span class="chip${i === 0 ? " on" : ""}">${t("addons.filter." + k)}</span>`).join("");
  const incl = [1, 2, 3, 4].map((n) => `${esc(W().incl)} ${n}`);
  return `<section class="step"><div class="stack g1"><h2 class="disp d20" style="margin:0">${t("addons.title")}</h2><p class="muted" style="margin:0">${t("addons.intro")}</p></div>
    <div class="stack g4">
      <div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px"><div class="stack"><h2 class="disp d20" style="margin:0">${tv("addons.section", { destination: esc(W().dest) })}</h2><p class="cap12 muted" style="margin:0" aria-live="polite">${tv("addons.count", { shown: 4, added: 2 })}</p></div><div role="group" aria-label="${esc(C().addons.filter.label)}" class="chips">${chips}</div></div>
      <div class="alist" role="region" aria-label="${esc(C().addons.listLabel)}">${items.map((it) => addOnRow(it, "row") + addOnRow(it, "phone")).join("")}</div>
    </div>
    <section class="incl-panel" aria-labelledby="inclh"><div class="hd"><h2 id="inclh" class="disp d20" style="margin:0">${t("inclusions.title")}</h2><span style="font-size:14px">${t("inclusions.note")}</span></div><ul>${incl.map((l) => `<li>${ic("check", 16)}<span>${l}</span></li>`).join("")}</ul></section>
    <section class="incl-compact"><h2>${t("inclusions.title")}</h2><p style="margin:0;font-size:14px">${esc(new Intl.ListFormat(NUML[LOC], { style: "short", type: "unit" }).format(incl))}</p></section>
    <div class="acts">${btn("ghost", t("addons.back"))}${btn("primary", t("addons.continue"), { cls: "hide-phone" })}</div></section>`;
}

/* ---------- step 3: travellers ---------- */
const FIELD_ERR = { name: "required", email: "email", phone: "phone", nat: "tooLong", req: "tooLong", emerName: "tooLong", emerPhone: "phone", n0: "required", n1: "required", n2: "required", n3: "required", a2: "age", a3: "age", pickup: "required" };
function stepTravellers(o = {}) {
  const e = o.errors ? (k) => t("travellers.errors." + FIELD_ERR[k]) : () => null;
  const err = (k) => (o.errors ? { err: e(k) } : {});
  const fv = (k, v) => (o.errors ? "" : v);
  const booker = `<div class="stack g4"><h3 class="disp d20" style="margin:0">${t("travellers.booker")}</h3><div class="fgrid">
    ${field(t("travellers.name"), "", { req: true, ...err("name") })}
    ${field(t("travellers.email"), "", { req: true, ...err("email") })}
    ${field(t("travellers.phone"), "", { req: true, ...err("phone") })}
    ${field(optLabel("travellers.nationality"), fv("nat", ""), err("nat"))}</div>
    ${field(optLabel("travellers.specialRequests"), "", { ta: true, ...err("req") })}
    <div class="fgrid">${field(optLabel("travellers.emergencyName"), "", err("emerName"))}${field(optLabel("travellers.emergencyPhone"), "", err("emerPhone"))}</div></div>`;
  const stays = !o.notStaying;
  const kinds = [["adultLine", 1, null], ["adultLine", 2, null], ["childLine", 1, "childAgeHint"], ["infantLine", 1, "infantAgeHint"]];
  const lines = kinds.map(([k, n, hint], i) => {
    const nameField = field(t("travellers.fullName"), "", { dis: i === 0 && stays, req: true, ...(i === 0 && stays ? {} : err("n" + i)) });
    const age = hint ? field(t("travellers.age"), "", { hint: o.errors ? null : t("travellers." + hint), ...(o.errors ? { err: e("a" + i) } : {}) }) : "";
    return `<div class="gline${hint ? "" : " one"}"><h4>${tv("travellers." + k, { n })}</h4>${nameField}${age}</div>`;
  }).join("");
  const pickup = o.pickup ? `<div class="stack g2"><h3 class="disp d20" style="margin:0">${t("travellers.pickupHeading")}</h3>${field(t("travellers.pickupHeading"), "", { req: true, hint: o.errors ? null : t("travellers.pickupHint"), ...(o.errors ? { err: e("pickup") } : {}) })}</div>` : "";
  const summary = o.errors ? `<p class="err" role="alert">${ic("alert")}<span>${(() => { const v = get("travellers.errors.summary"); return typeof v === "string" ? esc(v) : miss("travellers.errors.summary"); })()}</span></p>` : "";
  return `<section class="step"><h2 class="disp d20">${t("trip.stepTitle.travellers")}</h2>
    ${booker}
    ${checkbox(t("travellers.notStaying"), !!o.notStaying)}
    <div class="stack g4"><h3 class="disp d20" style="margin:0">${t("travellers.guestsHeading")}</h3>${lines}</div>
    ${pickup}
    ${o.choices || ""}
    ${summary}
    <div class="acts">${btn("ghost", t("travellers.back"))}${btn("primary", t("travellers.continue"), { cls: "hide-phone" })}</div></section>`;
}

/* ---------- step 4: request ---------- */
function choices(o = {}) {
  const eP = o.errors ? errLine(t("pay.choice.error")) : "", eA = o.errors ? errLine(t("pay.airport.error")) : "", eT = o.errors ? t("pay.terms.error") : null;
  const dep = o.depositBlock
    ? tcard(t("request.deposit"), { off: true, detail: t("request.depositUnavailable." + o.depositBlock) })
    : tcard(t("request.deposit"), { on: o.plan === "deposit", detail: tv("request.depositDetail", { now: aed(FIG.dep.now), balance: aed(FIG.dep.bal), date: ltr(D_BAL) }) });
  const full = tcard(t("request.full"), { on: o.plan === "full", detail: tv("request.fullDetail", { now: aed(FIG.full.total) }) });
  const ap = ["DXB", "AUH", "SHJ"].map((k) => tcard(t("request.airports." + k), { on: o.airport === k })).join("");
  return `<div class="stack g6">
    <div><h3 class="grouphd" id="payh">${t("request.paymentHeading")}</h3><div role="group" aria-labelledby="payh" class="tcards">${dep}${full}</div>${eP}</div>
    <div><h3 class="grouphd" id="aph">${t("request.airportHeading")}</h3><div role="group" aria-labelledby="aph" class="tcards">${ap}</div>${eA}<p class="muted" style="margin:8px 0 0">${t("request.returnSame")}</p></div>
    ${checkbox(`${t("request.terms").replace(/\[([^\]]+)\]/, '<span style="text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px">[$1]</span>')}`, !!o.terms, { err: eT })}</div>`;
}
function requestPre(o = {}) {
  const hold = btn("primary", o.holding ? t("request.holding") : t("request.hold"), { dis: o.holdDisabled || o.holding, busy: o.holding });
  const body = o.choicesAt === "travellers"
    ? `<p class="holding" role="status">${'<span class="sp"></span>'}<span>${t("request.holding")}</span></p>`
    : `${choices(o)}${reasons(o.reasons || [], "hold", { live: "alert" })}<div class="acts">${hold}</div>`;
  return `<section class="step"><h2 class="disp d20">${t("trip.stepTitle.request")}</h2>${body}${o.choicesAt === "travellers" ? reasons(o.reasons || [], "hold") : ""}</section>`;
}
function requestHeld(o = {}) {
  const dep = o.plan === "deposit";
  const planTxt = dep ? `<span class="t">${t("request.deposit")}</span><br><span class="muted">${tv("request.depositDetail", { now: aed(FIG.dep.now), balance: aed(FIG.dep.bal), date: ltr(D_BAL) })}</span>` : `<span class="t">${t("request.full")}</span><br><span class="muted">${tv("request.fullDetail", { now: aed(FIG.full.total) })}</span>`;
  const win = esc(get("request.window.hour").other.replace(/#/g, "[N]"));
  const amount = aed(dep ? FIG.dep.now : FIG.full.total);
  const nextKeys = [["nextSend", {}], ["nextEmail", {}], ["nextTransfer", { amount, window: win, ref: ltr(REF) }], ["nextReceipt", {}], ["nextWithdraw", {}]];
  return `<section class="step"><h2 class="disp d20">${t("trip.stepTitle.request")}</h2>
    <div class="heldbox"><div class="stack g1"><h3 class="disp d20" style="margin:0">${t("request.heldTitle")}</h3></div><span class="tm" role="timer">${tv("request.heldFor", { time: ltr("29:41") })}</span></div>
    <div class="chosen"><div class="top"><span></span>${btn("ghost", t("request.change"), { cls: "sm" })}</div>
      <dl><dt>${t("request.paymentHeading")}</dt><dd>${planTxt}</dd><dt>${t("request.airportHeading")}</dt><dd>${t("request.airports.DXB")}<br><span class="muted">${t("request.returnSame")}</span></dd><dt></dt><dd>${checkbox(t("request.terms").replace(/\[([^\]]+)\]/, '<span style="text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px">[$1]</span>'), true)}</dd></dl></div>
    <div class="stack g4"><h3 class="disp d20" style="margin:0">${t("request.nextHeading")}</h3><ol class="nextol">${nextKeys.map(([k, v]) => `<li>${tv("request." + k, v)}</li>`).join("")}</ol></div>
    <div class="stack g2">${btn("primary", o.sending ? t("request.sending") : t("request.send"), { busy: o.sending, dis: o.sending })}${o.tooMany ? `<ul class="reasons" aria-live="polite">${reasonLine({ code: "too_many_open" }, "quote", { live: "alert" })}</ul>` : ""}</div>
    <p class="oneline">${lnk(t("summary.secondCity"))}</p></section>`;
}
function requestEnded() {
  return `<section class="step"><h2 class="disp d20">${t("trip.stepTitle.request")}</h2><div class="endbox" role="alert"><p class="b16" style="margin:0">${t("request.ended")}</p><a class="btn btn-primary btn-up wrap">${t("request.startAgain")}</a></div></section>`;
}
function dialogOver(page) {
  return `<div class="ovl">${page}<div class="scrim"></div><div class="dpos"><div class="cdlg" role="alertdialog"><h2 class="disp d32">${t("request.changeTitle")}</h2><p class="b16">${t("request.changeBody")}</p><div class="acts">${btn("danger", t("request.changeConfirm"))}${btn("secondary", t("request.changeCancel"))}</div></div></div></div>`;
}

/* ---------- Book on the stay page ---------- */
const WAbtn = (o = {}) => `<a class="btn btn-secondary${o.icon ? " nopad" : " btn-up"}${o.cls ? " " + o.cls : ""}" ${o.icon ? `aria-label="${esc(WA[LOC])}"` : ""}>${ic("wa")}${o.icon ? "" : `<span>${esc(WA[LOC])}</span>`}</a>`;
function jbar(hasDates) {
  const dv = hasDates ? dates() : `<span>${t("bar.dates.empty")}</span>`;
  const book = `<button type="button" class="btn btn-primary btn-up">${t("book.label")}</button>`;
  return `<div class="stayhero" role="img"></div>
    <div class="jbar" role="group" aria-label="${esc(C().bar.label)}">
      <div class="seg" style="flex:10"><span class="l">${t("bar.destination.label")}</span><span class="v">${ic("lock", 16)}<span>${esc(W().dest)}</span></span></div><span class="dv"></span>
      <div class="seg" style="flex:13"><span class="l">${t("steps.stay")}</span><span class="v">${ic("lock", 16)}<span>${esc(W().stay)}</span></span></div><span class="dv"></span>
      <div class="seg" style="flex:13"><span class="l">${t("bar.dates.label")}</span><span class="v${hasDates ? "" : " ph"}">${dv}</span></div><span class="dv"></span>
      <div class="seg" style="flex:10"><span class="l">${t("bar.guests.label")}</span><span class="v">${guests4()}</span></div>
      <div class="act">${book}${WAbtn()}</div></div>
    ${hasDates ? "" : `<p class="jalert" role="alert">${ic("alert")}${t("book.needDates")}</p>`}`;
}
function entryRow() {
  return `<div class="stayhero" role="img"></div><div class="entry" style="margin:-32px 0 0">${ic("search")}<span class="tt"><span class="b16">${esc(W().dest)}${SEP()}${esc(W().stay)}</span><span class="cap12 muted">${dates()} · ${guests4()}</span></span><span class="go">${ic("arrow", 20, "flip")}</span></div>`;
}
function bookBar(hasDates) {
  return `<div class="page">${WIDTH >= 768 ? jbar(hasDates) : `${entryRow()}<p class="stub2">Below 768 the bar is this entry row; Book sits in the dock (see book-dock).</p>`}</div>`;
}
function bookSheet() {
  const row = (label, hint, v, min) => `<div class="gr"><div class="stack"><span>${label}</span><span class="cap12 muted"><bdi>${hint}</bdi></span></div><span class="stp"><i class="${v <= min ? "off" : ""}">−</i><b>${v}</b><i>+</i></span></div>`;
  return `<div class="phonemock sheet"><div class="sh"><span class="ib">${ic("back", 20, "flip")}</span><span class="cap12 muted tnum">${tv("sheet.progress", { n: 3 })}</span><span class="ib">${ic("x")}</span></div>
    <div class="pb"><span></span><span></span><span></span></div>
    <div class="sb"><h2 class="disp d48" style="margin:0">${t("sheet.who")}</h2>
      <div role="group" aria-label="${esc(C().guests.label)}">${row(t("guests.adults"), esc(C().guests.adultsHint), 2, 1)}${row(t("guests.children"), esc(C().guests.childrenHint), 1, 0)}${row(t("guests.infants"), esc(C().guests.infantsHint), 1, 0)}<p class="cap12 muted" style="margin:16px 0 0">${t("guests.floor")}</p></div></div>
    <div class="ft"><div class="sm"><span class="muted" style="font-size:14px;color:var(--color-ink)">${guests4()}</span><span class="cap12 muted">${esc(W().dest)} · ${dates()}</span></div>
      ${btn("primary", t("book.label"), { lg: true, wide: true })}<a class="btn btn-secondary btn-up lg wide">${ic("wa")}<span>${esc(WA[LOC])}</span></a></div></div>`;
}
function bookDock() {
  return `<div class="phonemock" style="min-height:640px"><div class="stayhero" role="img" style="border:0;border-bottom:1px solid var(--color-line)"></div>
    <div style="padding:24px 16px" class="stack g2"><p class="kick" style="margin:0">${esc(W().dest)}</p><h1 class="disp d32" style="margin:0">${esc(W().stay)}</h1></div>
    <div class="dockmock"><div class="sm"><span class="b16">${esc(W().dest)}${SEP()}${esc(W().stay)}</span><span class="muted" style="font-size:14px">${dates()} · ${guests4()}</span></div>
      <div class="row gx2" style="flex-wrap:nowrap">${btn("primary", t("book.label"))}${WAbtn({ icon: true })}</div></div></div>`;
}

/* ---------- reasons-all ---------- */
function reasonsAll() {
  const rows = [];
  for (const code of CODES) {
    if (code === "deposit_unavailable") { for (const cause of CAUSES) rows.push(reasonLine({ code, cause }, "quote", { code: `${code} · ${cause}` })); continue; }
    const r = { code, min: 3, max: 6 };
    rows.push(reasonLine(r, "quote", { code }));
    if (code === "sold_out" || code === "blocked") rows.push(reasonLine(r, "hold", { code: `${code} · at hold` }));
  }
  return `<div class="page" style="max-width:720px"><ul class="reasons">${rows.join("")}</ul></div>`;
}

/* ---------- state registry ---------- */
const STATES = {};
const add = (id, fn, note, o = {}) => { STATES[id] = { id, fn, note, ...o }; };
const L1 = { figs: "stay", lines: [] };
const LB = { figs: "full", lines: addOnLines(), incl: true };
const stayState = (rs, o = {}) => () => layout(1, stepStay({ reasons: rs, disabled: o.disabled }), { ...L1, plan: null, ...(o.cart || {}) });
add("stay", stayState([]), "Step 1: the stay, dates, guests, one-destination line");
add("stay-taken", stayState([{ code: "sold_out" }, { code: "blocked" }], { disabled: true, cart: { figs: "none", loading: true } }), "sold_out and blocked, with the nights; Continue off; no quote, so no amounts");
add("stay-rules", stayState([{ code: "below_min_nights", min: 3 }, { code: "over_max_guests", max: 6 }], { disabled: true, cart: { figs: "none", loading: true } }), "below_min_nights and over_max_guests with their numbers");
add("stay-setup", stayState([{ code: "no_rate" }, { code: "settings_missing" }], { disabled: true, cart: { figs: "none", loading: true } }), "no_rate and settings_missing");
add("stay-closed", stayState([{ code: "requests_closed" }], { disabled: true }), "requests_closed: the closed line and WhatsApp, Continue disabled, breakdown kept");
add("addons", () => layout(2, stepAddons(), LB), "Step 2: home pickup added, a second UAE service not added, one add-on without an image, inclusions, cart");
add("travellers", () => layout(3, stepTravellers({ pickup: false }), LB), "Step 3: 2 adults, 1 child, 1 infant, empty");
add("travellers-errors", () => layout(3, stepTravellers({ errors: true, pickup: true }), LB), "Step 3: every field error at once");
add("travellers-not-staying", () => layout(3, stepTravellers({ notStaying: true }), LB), "Step 3: I am not staying ticked; line 1 is no longer the booker");
add("travellers-pickup", () => layout(3, stepTravellers({ pickup: true }), LB), "Step 3: home pickup in the cart, so one pickup address");
add("request-choose", () => layout(4, requestPre({ plan: "deposit", airport: "DXB", terms: true }), { ...LB, plan: "deposit" }), "Option A: choices made, terms ticked, ready to press Hold");
add("request-errors", () => layout(4, requestPre({ errors: true }), { ...LB, plan: null }), "Option A: Hold pressed with nothing chosen");
add("request-deposit-close", () => layout(4, requestPre({ depositBlock: "too_close_to_arrival" }), { ...LB, plan: null }), "Deposit off: too_close_to_arrival");
add("request-deposit-unset", () => layout(4, requestPre({ depositBlock: "no_due_days" }), { ...LB, plan: null }), "Deposit off: no_due_days");
add("request-held", () => layout(4, requestHeld({ plan: "full" }), { ...LB, plan: "full", locked: true }), "Held, full payment, 29:41 left, choices and cart read-only");
add("request-held-deposit", () => layout(4, requestHeld({ plan: "deposit" }), { ...LB, plan: "deposit", locked: true }), "Held, deposit: due first and balance by date in the cart and the text");
add("request-sending", () => layout(4, requestHeld({ plan: "full", sending: true }), { ...LB, plan: "full", locked: true }), "Send request pressed: busy");
add("request-taken", () => layout(4, requestPre({ plan: "full", airport: "DXB", terms: true, reasons: [{ code: "sold_out" }] }), { ...LB, plan: "full" }), "Hold refused: sold_out read as “These dates were just taken”");
add("request-closed", () => layout(4, requestPre({ plan: "full", airport: "DXB", terms: true, holdDisabled: true, reasons: [{ code: "requests_closed" }] }), { ...LB, plan: "full" }), "Hold refused: requests_closed; Hold disabled");
add("request-too-many", () => layout(4, requestHeld({ plan: "full", tooMany: true }), { ...LB, plan: "full", locked: true }), "Held; too_many_open under Send request, button stays live");
add("request-change", () => dialogOver(layout(4, requestHeld({ plan: "full" }), { ...LB, plan: "full", locked: true })), "Change pressed: asks before releasing the hold");
add("q01-b-travellers", () => layout(3, stepTravellers({ pickup: false, choices: `<div class="sec" style="margin-top:0">${choices({})}</div>` }), { ...LB, plan: null }), "Option B: choices at the end of Travellers, nothing chosen, Continue to request");
add("q01-b-request-holding", () => layout(4, requestPre({ choicesAt: "travellers", holding: true }), { ...LB, plan: "full" }), "Option B: the Request step opens and places the hold");
add("hold-ended", () => layout(4, requestEnded(), { ...LB, plan: null }), "Timer reached 00:00: inputs kept, Start again");
add("reasons-all", reasonsAll, "BookingReasons with every ReasonCode and every deposit cause (code tags are review chrome)", { bare: true });
add("book-bar", () => bookBar(true), "Stay page, from 768: Book (teal) beside Request on WhatsApp (outline)", { bare: true });
add("book-bar-no-dates", () => bookBar(false), "Stay page, no dates yet: Book asks for dates in the alert line", { bare: true });
add("book-sheet", bookSheet, "Phone: the sheet's last step, Book above Request on WhatsApp (drawn at 390)", { bare: true });
add("book-dock", bookDock, "Phone: the dock, Book plus the WhatsApp icon (drawn at 390)", { bare: true });

/* ---------- groups: Task 2's owner questions ---------- */
const GROUPS = [
  { id: "q10", h: "Q-10 · What happens next", sig: "approve", q: "After Hold, the guest reads five lines: nothing is charged here, the bank details arrive by email, transfer the amount in AED within the window with the reference, reply with the receipt, and withdraw on the booking page until money is recorded. Approve or change?", ids: ["request-held"] },
  { id: "q01", h: "Q-01 · When the 30-minute hold starts", sig: "choice", q: "Should the guest press “Hold my dates for 30 minutes” on the Request step (A), or should the choices sit at the end of Travellers and the hold start by itself as Request opens (B)? A is recommended: the hold is a deliberate act, and B places a hold on every entry into Request (5 per email per hour).", opts: [{ tag: "A (recommended): the guest presses Hold", ids: ["request-choose", "request-held"] }, { tag: "B: the hold starts as Request opens", ids: ["q01-b-travellers", "q01-b-request-holding", "request-held"] }] },
  { id: "q02", h: "Q-02 · Book on the stay page", sig: "approve", q: "Book is the teal button; Request on WhatsApp becomes the outline button beside it in the bar, the sheet's last step and the dock (phone dock: Book plus the WhatsApp icon). Approve or change?", ids: ["book-bar", "book-bar-no-dates", "book-sheet", "book-dock"] },
  { id: "dep", h: "Deposit unavailable (no question)", sig: "info", q: "When arrival is close (or no balance day is set) the Deposit card is greyed with its sentence; Full payment and the airports are square cards, no radios.", ids: ["request-deposit-close", "request-deposit-unset"] },
  { id: "q04", h: "Q-04 · Travellers and the pickup address", sig: "approve", q: "One pickup address, used for the return too; a different return address goes in Special requests. Optional fields say Optional; one line per guest, children and infants with age. Approve or change?", ids: ["travellers-pickup", "travellers-not-staying"] },
  { id: "q12", h: "Q-12 · Reasons and requests closed", sig: "approve", q: "Every reason is one sentence with its way out; when requests are closed the guest stops at step 1 with the closed line and WhatsApp, and the Hold button is off on Request. Approve or change?", ids: ["stay-closed", "reasons-all", "request-closed"] },
  { id: "q03", h: "Q-03 · Amounts in AED only", sig: "approve", q: "No currency control and no “about USD or EUR” line: every amount is AED, the transfer currency. Approve or change?", ids: ["addons", "request-held-deposit"] },
  { id: "q08", h: "Q-08 · After the hold, Change asks first", sig: "approve", q: "Once held, plan, airport, terms and the cart are read-only. Change asks “Changing releases your hold”, then releases it and reopens the step. Approve or change?", ids: ["request-change", "request-held"] },
  { id: "oth", h: "Other states (no owner question of their own)", sig: "info", q: "Step 1 with its reasons, Travellers, the Hold and Send outcomes, and the end of the hold.", ids: ["stay", "stay-taken", "stay-rules", "stay-setup", "travellers", "travellers-errors", "request-errors", "request-sending", "request-taken", "request-too-many", "hold-ended"] },
];

/* ---------- render ---------- */
const rendered = new Set();
function frameHTML(id, tag) {
  const s = STATES[id];
  const anchor = rendered.has(id) ? "" : ` id="s-${id}"`;
  rendered.add(id);
  const phoneOnly = id === "book-sheet" || id === "book-dock";
  const body = s.bare ? `<div class="inner">${s.fn()}</div>` : `<div class="inner">${s.fn()}</div>`;
  return `<div class="fr"${anchor}><div class="cap"><code>${id}</code>${tag ? `<span class="opt${tag.startsWith("A") ? " rec" : ""}">${esc(tag)}</span>` : ""}<span class="rules">${esc(s.note)}${phoneOnly ? "" : ""}</span></div><div class="fw" data-w="${WIDTH}"><div class="frame" style="width:${WIDTH}px" lang="${LOC}" dir="${LOC === "ar" ? "rtl" : "ltr"}">${body}</div></div></div>`;
}
const stub = (id, why) => `<div class="stub"><code>${id}</code> ${why}: <a href="#s-${id}">jump to it</a>.</div>`;
function render() {
  rendered.clear(); MISSING_KEYS.clear();
  let html = `<div class="banner"><strong>04-03 pictures for signature (no shoot).</strong> Look and layout follow components/journey/*, components/ui/*, components/pages/stay-detail/booking.tsx and tokens.json; every visible string is read from lib/copy/journey.ts (EN, AR right-to-left, ES) and the three "Request on WhatsApp" words of lib/copy/stay-detail.ts. A string that does not exist shows a red MISSING COPY box. Amounts are example AED figures, not prices; the VAT rate is "[00]", the window "[N]", the terms "[Booking terms]", names "[Guest name]". Images are empty frames. The site navigation and footer (PublicFrame) are not drawn. Below 768 the cart is a dock at the bottom (steps 1–3) or sits in the page (step 4); in the dock the step's own Continue button is hidden. AR and ES texts are drafts for review at UAT.</div>`;
  for (const g of GROUPS) {
    let inner = "";
    if (g.sig === "choice") {
      if (CMP) {
        /* Compare: A and B side by side; the shared held picture is drawn once, in A */
        inner = `<div class="cmp">${g.opts.map((o, oi) => `<div class="cmpcol"><div class="cap"><span class="opt${oi === 0 ? " rec" : ""}">${esc(o.tag)}</span></div>${o.ids.map((id) => (rendered.has(id) ? stub(id, "same picture as in A") : frameHTML(id))).join("")}</div>`).join("")}</div>`;
      } else {
        inner = g.opts.map((o, oi) => `<div class="cap" style="margin-top:12px"><span class="opt${oi === 0 ? " rec" : ""}">${esc(o.tag)}</span></div>${o.ids.map((id) => (rendered.has(id) ? stub(id, "same picture as above") : frameHTML(id))).join("")}`).join("");
      }
    } else {
      inner = g.ids.map((id) => (rendered.has(id) ? stub(id, "already drawn") : frameHTML(id))).join("");
    }
    html += `<section class="grpbox" id="g-${g.id}"><h2>${esc(g.h)}</h2>${g.sig === "choice" ? '<span class="tag">Owner signature: choose</span>' : g.sig === "approve" ? '<span class="tag">Owner signature: approve or change</span>' : ""}<p class="q">${esc(g.q)}</p>${inner}</section>`;
  }
  document.getElementById("main").innerHTML = html;
  const mk = [...MISSING_KEYS];
  document.getElementById("misslist").textContent = mk.length ? "Missing copy in " + LOC.toUpperCase() + ": " + mk.join(", ") : "";
  fit();
}
function fit() {
  const mainW = document.getElementById("main").clientWidth - 48;
  document.querySelectorAll(".fw").forEach((fw) => {
    const f = fw.firstElementChild, cmp = fw.closest(".cmp");
    const avail = cmp ? (mainW - 20) / 2 : mainW;
    const sc = Math.min(1, avail / WIDTH);
    fw.style.width = Math.round(WIDTH * sc) + 2 + "px";
    f.style.transform = `scale(${sc})`;
    fw.style.height = Math.ceil(f.offsetHeight * sc) + 2 + "px";
  });
}
function buildIndex() {
  let h = "";
  for (const g of GROUPS) {
    h += `<h2>${esc(g.h.split(" · ")[0])}</h2><a href="#g-${g.id}">${esc(g.h.split(" · ").slice(1).join(" · ") || g.h)}</a>`;
    const ids = g.sig === "choice" ? [...new Set(g.opts.flatMap((o) => o.ids))] : g.ids;
    h += ids.map((id) => `<a class="st" href="#s-${id}">${id}</a>`).join("");
  }
  document.getElementById("index").innerHTML = h;
}
function setPressed() {
  document.querySelectorAll("#top [data-loc]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.loc === LOC));
  document.querySelectorAll("#top [data-w]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.w === WIDTH));
  document.getElementById("cmp").setAttribute("aria-pressed", CMP);
}
document.querySelectorAll("#top [data-loc]").forEach((b) => b.addEventListener("click", () => { LOC = b.dataset.loc; setPressed(); render(); }));
document.querySelectorAll("#top [data-w]").forEach((b) => b.addEventListener("click", () => { WIDTH = +b.dataset.w; setPressed(); render(); }));
document.getElementById("cmp").addEventListener("click", () => { CMP = !CMP; setPressed(); render(); });
window.addEventListener("resize", fit);
window.addEventListener("load", () => { fit(); setTimeout(fit, 400); });
buildIndex(); setPressed(); render();

</script></body></html>
