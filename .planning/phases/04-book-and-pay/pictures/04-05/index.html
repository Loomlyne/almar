<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMAR 04-05 pictures: booking emails and guest booking page</title>
<style>
:root{
  --color-ivory:#fffaf0;--color-surface:#ffffff;--color-teal:#1f3b40;--color-teal-hover:#1b3438;--color-teal-press:#182d31;
  --color-teal-tint:#d1dfe0;--color-gold:#d4ba8a;--color-ink:#262626;--color-muted:#63615f;--color-line:rgb(38 38 38 / 0.16);
  --color-error:#8f2d2d;--color-success:#1e6b45;--color-warning:#8a3b12;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;
  --control:44px;--chip:40px;--chip-dense:24px;--row:56px;--dock:88px;--search:200px;
  --container-dialog:480px;--container-column:1240px;--container-calendar:760px;
  --radius-control:0;--radius-overlay:0;
  --shadow-lg:0 28px 56px -16px rgb(10 9 7 / 0.28),0 10px 20px -10px rgb(10 9 7 / 0.12);

  --face-display:Georgia,"Times New Roman",serif;
  --face-body:"Lato",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --tracking-kicker:0.12em;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:#ece8df;color:var(--color-ink);font-family:var(--face-body);font-size:14px}
/* ---------- page chrome (review page only, not product UI) ---------- */
#top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:10px 20px;background:var(--color-teal);color:var(--color-ivory)}
#top h1{font:400 18px var(--face-display);margin:0;margin-inline-end:auto}
#top .grp{display:flex;align-items:center;gap:6px}
#top .grp span.l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-inline-end:4px}
#top button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(255,250,240,.5);background:transparent;color:var(--color-ivory);cursor:pointer}
#top button[aria-pressed=true]{background:var(--color-ivory);color:var(--color-teal);border-color:var(--color-ivory)}
#wrap{display:flex;align-items:flex-start}
#index{position:sticky;top:52px;align-self:flex-start;width:268px;flex:none;height:calc(100vh - 52px);overflow:auto;background:var(--color-ivory);border-inline-end:1px solid var(--color-line);padding:14px 14px 40px;font-size:13px}
#index h2{font:400 12px var(--face-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-muted);margin:16px 0 4px}
#index a{display:block;color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:3px;padding:2px 0}
#index a.st{margin-inline-start:12px;text-decoration:none;color:var(--color-ink)}
#index a.st:hover{text-decoration:underline;text-decoration-color:var(--color-gold)}
#main{flex:1;min-width:0;padding:20px 24px 80px}
.banner{background:var(--color-ivory);border:1px solid var(--color-gold);padding:10px 14px;margin-bottom:20px;font-size:13px;line-height:1.5}
.grpbox{margin:0 0 44px}
.grpbox>h2{font:400 22px var(--face-display);color:var(--color-teal);margin:0 0 4px}
.grpbox>.q{margin:0 0 4px;font-size:14px;line-height:1.5;max-width:900px}
.grpbox>.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--color-teal);color:var(--color-teal);padding:2px 8px;margin-bottom:8px}
.fr{margin:14px 0 26px}
.cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.cap code{font:600 13px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);padding:2px 6px}
.cap .opt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-teal)}
.cap .opt.rec{font-weight:700}
.cap .rules{font-size:12px;color:var(--color-muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.fw{position:relative;overflow:hidden;border:1px solid var(--color-line);background:var(--color-ivory)}
.stub{border:1px dashed var(--color-muted);padding:10px 14px;font-size:13px;background:#fff}
.stub a{color:var(--color-teal)}
/* ---------- product frame ---------- */
.frame{container-type:inline-size;position:relative;transform-origin:top left;background:var(--color-ivory);color:var(--color-ink);font-family:var(--face-body);font-size:14px;line-height:1.43}
.inner{--px:16px;--py:24px;padding:var(--py) var(--px) calc(var(--py) + 16px)}
.frame[dir=rtl]{font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.63;text-align:start}
.frame[dir=rtl] .disp{font-family:"Noto Naskh Arabic","Noto Sans Arabic",var(--face-display);line-height:1.5}
.disp{font-family:var(--face-display);font-weight:400;color:var(--color-teal);margin:0}
.h1{font-size:32px;line-height:1.2}.h2{font-size:20px;line-height:1.3}
.cap12{font-size:12px;line-height:1.5}
.muted{color:var(--color-muted)}
.kick{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted)}
.frame[dir=rtl] .kick,.frame[dir=rtl] .btn-up{text-transform:none;letter-spacing:0}
.stack{display:flex;flex-direction:column}.g1{gap:4px}.g2{gap:8px}.g4{gap:16px}.g6{gap:24px}
.row{display:flex;flex-wrap:wrap;align-items:center}.gx2{gap:8px}.gx4{gap:16px}
.sec{border-top:1px solid var(--color-line);padding-top:16px;margin-top:24px;display:flex;flex-direction:column;gap:8px}
.sec>.disp.h2{margin-bottom:4px}
/* buttons (components/ui/button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;height:var(--control);padding:0 24px;border:1px solid transparent;font:inherit;font-size:14px;cursor:pointer;background:transparent}
.btn-up{text-transform:uppercase;letter-spacing:.12em}
.btn-primary{background:var(--color-teal);color:var(--color-ivory);border-color:var(--color-teal)}
.btn-secondary{background:transparent;color:var(--color-teal);border-color:var(--color-teal)}
.btn-ghost{background:transparent;color:var(--color-teal);border-color:transparent;text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px}
.btn-danger{background:transparent;color:var(--color-ink);border-color:var(--color-error)}
.btn:disabled{background:var(--color-ivory);border-color:var(--color-line);color:var(--color-muted);cursor:default;text-decoration:none}
.btn.sm{padding:0 16px}
.link{color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:4px;text-decoration-thickness:1px;background:none;border:0;padding:0;font:inherit;cursor:pointer;min-height:var(--control);display:inline-flex;align-items:center;gap:8px}
/* chips */
.chip{display:inline-flex;align-items:center;height:var(--chip);padding:0 16px;border:1px solid var(--color-muted);color:var(--color-ink);background:transparent;white-space:nowrap}
.chip.dense{height:var(--chip-dense);padding:0 8px;font-size:12px}
.chip.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* fields */
.field{display:grid;gap:8px;max-width:384px;width:100%}
.field.wide{max-width:none}
.field>label,.field>.lb{font-size:14px;color:var(--color-ink)}
.inp{display:block;width:100%;min-height:var(--control);border:1px solid var(--color-ink);background:var(--color-surface);padding:8px 16px;font:inherit;font-size:14px;color:var(--color-ink);text-align:start}
.inp.ta{min-height:96px}
.inp.bad{border-color:var(--color-error)}
.inp.ph{color:var(--color-muted)}
.inp.dis{background:var(--color-ivory);color:var(--color-muted);border-color:var(--color-line)}
.hint{margin:0;font-size:14px;color:var(--color-ink)}
.hint.m{color:var(--color-muted);font-size:12px}
.err{margin:0;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--color-error)}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:var(--control);min-width:96px;padding:0 16px;border:1px solid var(--color-muted);background:var(--color-surface);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-ink)}
.frame[dir=rtl] .sel{text-transform:none;letter-spacing:0}
.chk{display:flex;align-items:center;gap:12px;min-height:var(--control)}
.chk i{width:20px;height:20px;border:1px solid var(--color-ink);background:var(--color-surface);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal)}
.chk i.on{background:var(--color-teal);border-color:var(--color-teal);color:var(--color-ivory)}
/* blocks */
.block{border:1px solid var(--color-line);background:var(--color-surface);padding:16px}
.attn{border:1px solid var(--color-error);border-inline-start-width:4px;background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.attn .t{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--color-error)}
.attn p{margin:0}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 16px;margin:0}
.dl dt{color:var(--color-muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.dl .tot{font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--color-line)}
.mrow.b{font-weight:700}
.cols2{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.cols2{grid-template-columns:1fr 1fr}.tbl{display:table!important}.cards{display:none!important}.inner{--px:32px;--py:32px}}
.tbl{display:none;width:100%;border-collapse:collapse}
.tbl th{height:var(--row);padding:0 8px;text-align:start;font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted);border-bottom:1px solid var(--color-line)}
.frame[dir=rtl] .tbl th{text-transform:none;letter-spacing:0}
.tbl td{padding:10px 8px;vertical-align:top;border-bottom:1px solid var(--color-line)}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.cards li{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:6px}
.strike{text-decoration:line-through;color:var(--color-muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--color-ink);margin-top:4px}
.flags span{border-inline-start:2px solid var(--color-ink);padding-inline-start:6px}
.flags span.e{border-color:var(--color-error);color:var(--color-error)}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--color-line)}
.ev time{color:var(--color-muted);white-space:nowrap}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--color-line);padding-bottom:8px;margin-top:24px}
.tabs .btn[aria-pressed=true]{text-decoration-thickness:3px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin:16px 0 24px}
.miss{background:#fde8e8;border:2px solid #c00000;color:#8b0000;font:600 12px ui-monospace,Menlo,monospace;padding:8px 10px;margin:8px 0;direction:ltr;text-align:left}
.empty{border:1px solid var(--color-line);background:var(--color-surface);padding:32px 16px;text-align:center;color:var(--color-muted)}
/* dialogs (components/ui/dialog.tsx) */
.dlgwrap{position:relative;overflow:hidden;min-height:520px;margin:calc(-1*var(--py)) calc(-1*var(--px)) calc(-1*var(--py) - 16px)}
.dlgwrap .behind{position:absolute;inset:0;overflow:hidden;padding:var(--py) var(--px)}
.dlgwrap .scrim{position:absolute;inset:0;background:rgb(38 38 38 / .4)}
.dlgpos{position:relative;padding:32px 16px 40px}
.dlg{width:100%;max-width:var(--container-dialog);margin-inline:auto;background:var(--color-surface);padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.dlg.wide{max-width:var(--container-column)}
.dlg .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dlg .hd .xb{width:var(--control);height:var(--control);display:inline-flex;align-items:center;justify-content:center;color:var(--color-teal);flex:none}
.dlg .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.dlg p.s{margin:0;font-size:16px;line-height:1.5}
.frame[dir=rtl] .dlg p.s{line-height:1.7}
.dlg ul.sent{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.dlg ul.sent li{font-size:16px;border-inline-start:2px solid var(--color-gold);padding-inline-start:12px}
svg.i{width:16px;height:16px;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.two{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:768px){.two{grid-template-columns:1fr 1fr}}
.tr-box{border:1px solid var(--color-line);background:var(--color-surface);padding:16px;display:flex;flex-direction:column;gap:16px}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:8px}
.ok{color:var(--color-success)}

#misslist{flex-basis:100%;font:600 12px ui-monospace,Menlo,monospace;color:#ffb4b4}
#misslist:empty{display:none}
.meta{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:12px;color:var(--color-ink);background:#fff;border:1px solid var(--color-line);border-bottom:0;padding:6px 10px;max-width:900px}
.meta b{font-weight:700;margin-inline-end:4px;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--color-muted)}
.altflag{background:#fde8e8;border:2px solid #c00000;color:#8b0000;font:600 12px ui-monospace,Menlo,monospace;padding:6px 10px;margin:0 0 6px}
/* ---------- emails: the 600 px table skeleton, ivory ground, Teal button with Ivory text, gold only as a top rule ---------- */
.em{background:var(--color-ivory);padding:40px 16px;color:var(--color-ink);font-family:var(--face-body);font-size:16px;line-height:1.5;text-align:left}
.em[dir=rtl]{text-align:right;font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.7}
.em[dir=ltr]{font-family:var(--face-body);line-height:1.5;text-align:left}
.em .e6{max-width:600px;margin:0 auto}
.em .mast{font:400 24px var(--face-display);color:var(--color-teal);padding-bottom:24px}
.em[dir=rtl] .mast,.em[dir=rtl] .eh{font-family:"Noto Naskh Arabic","Noto Sans Arabic",var(--face-display)}
.em .testb{border:1px solid var(--color-ink);padding:12px 16px;font-size:14px;margin:0 0 24px;background:#fff}
.em .eh{font:400 24px/1.3 var(--face-display);color:var(--color-teal);margin:0 0 16px}
.em p{margin:0 0 16px}
.em table.er{width:100%;border-collapse:collapse;margin:0 0 16px}
.em .er td{padding:6px 0;vertical-align:top;font-size:14px;border-bottom:1px solid var(--color-line);overflow-wrap:anywhere}
.em .er td:first-child{color:var(--color-muted);width:40%;padding-inline-end:12px}
.em .erule{border-top:1px solid var(--color-gold);margin:24px 0}
.em .ebtn{display:inline-block;padding:16px 24px;background:var(--color-teal);color:var(--color-ivory);font-size:14px;text-decoration:none}
.em .enote{font-size:12px;color:var(--color-muted);margin:0 0 8px}
/* ---------- booking page ---------- */
.pg1 .testbar{border:1px solid var(--color-ink);background:var(--color-surface);padding:12px 16px;margin:0 0 16px;font-size:14px}
.pg1 .wnote{border:1px solid var(--color-teal);padding:16px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
.pg1 .wnote p{margin:0}
.pg1 h1.disp{margin:0 0 8px}
.pg1 p{margin:0 0 8px}
.pg1 .refrow{margin:0 0 16px;gap:8px 12px}
.pg1 .pg{display:grid;grid-template-columns:1fr;gap:24px}
@container (min-width:768px){.pg1 .pg{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.pg1 .facts{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.pg1 .line{border-inline-start:1px solid var(--color-ink);padding-inline-start:12px;margin:0;display:flex;flex-direction:column;gap:8px}
.pg1 .line p{margin:0}
.pg1 .contact{margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.pg1 .tb{display:flex;flex-direction:column;gap:8px}
.pg1 .tb p{margin:0}
.pg1 .tb .amt b{font-size:20px}
.pg1 .tb .late{border:1px solid var(--color-ink);padding:12px}
.pg1 .tb dd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pg1 .block h2.h2{margin-bottom:8px}
.pg1 .sec{margin-top:0}
.pg1 .img{aspect-ratio:16/9;background:var(--color-ivory);border:1px solid var(--color-line);margin-bottom:8px}
.pg1 .cards2,.pg1 .plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pg1 .cards2 li{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--color-line);background:var(--color-surface);padding:12px}
.pg1 .plain li{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.pg1 .dl .tot{font-weight:700}
.pg1 .btn.sm{height:36px;padding:0 12px;font-size:12px}
.pg1 .errtx{color:var(--color-error)}
.pg1.printmode{background:#fff}
.pg1.printmode button,.pg1.printmode .cpb{display:none}
.dlgwrap.tall{min-height:760px}
.dlgpos.mid{position:absolute;inset:0;display:flex;align-items:center;padding:16px}
.dlgpos.mid .dlg{margin:0 auto}
.dlg .s{margin:0}

/* ALMAR 04-05 pictures. Every visible product string is read from D (a verbatim dump, made by a node script, of
   BOOKING_EMAIL_COPY, OWNER_EMAIL_COPY, BOOKING_PAGE_COPY, JOURNEY_COPY[locale].bookingStatus, the view fixtures and
   the real bookingPageModel results for them). Layout follows the plan's behaviour text; amounts are the fixtures' test
   values. Nothing here is wired. A string that does not exist shows a red MISSING COPY box. */
const LOCS = ["en", "ar", "es"];
let LOC = "en", WIDTH = 1440, CMP = false;
const MISSING = new Set();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const get = (root, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), root);
const missBox = (p) => { MISSING.add(p); return `<div class="miss">MISSING COPY: ${esc(p)}</div>`; };
const cg = (root, path, tag) => { const v = get(root, path); return typeof v === "string" && v.trim() ? esc(v) : missBox((tag || "") + path); };
const ce = (p) => cg(D.email[LOC], p, "email.");
const co = (p) => cg(D.owner, p, "owner.");
const cp = (p) => cg(D.page[LOC], p, "page.");
const cs = (p) => cg(D.status[LOC], p, "bookingStatus.");
const grp = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const aed = (f) => "AED " + grp(Math.floor(f / 100)) + "." + String(f % 100).padStart(2, "0");
const dmy = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m[3] + "/" + m[2] + "/" + m[1]; };
const uae = (iso) => { const d = new Date(Date.parse(iso) + 4 * 3600000); const p = (n) => String(n).padStart(2, "0"); return { date: p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear(), time: p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) }; };
const ltrS = (x) => `<span dir="ltr">${x}</span>`;   /* emails (plan: span dir=ltr) */
const ltrB = (x) => `<bdi dir="ltr">${x}</bdi>`;     /* page */
const spaceIban = (r) => r.replace(/(.{4})/g, "$1 ").trim();
const F = () => D.fmt[LOC];
const clone = (o) => JSON.parse(JSON.stringify(o));
const IBAN_SHOWN = "AE07 0331 2345 6789 0123 456";
const SUBJ_TEST = "[TEST] ";

/* ============================ EMAILS (shell: 600 px table, Teal button with Ivory text, gold only as a top rule) ============================ */
const eh = (t) => `<h2 class="eh">${t}</h2>`;
const ep = (t, cls = "") => `<p class="${cls}">${t}</p>`;
const erows = (list) => `<table class="er" role="presentation">${list.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`;
const erule = () => `<div class="erule"></div>`;
const ebtn = (l) => `<p><a class="ebtn">${l}</a></p>`;
const enote = (t) => `<p class="enote">${t}</p>`;
function edoc({ lang, dir, test, banner, blocks }) {
  const t = test ? `<p class="testb">${banner}</p>` : "";
  return `<div class="em" lang="${lang}" dir="${dir}"><div class="e6"><div class="mast">ALMAR Private Journey</div>${t}${blocks.join("")}</div></div>`;
}
function guestDoc(test, blocks) { return edoc({ lang: LOC, dir: LOC === "ar" ? "rtl" : "ltr", test, banner: ce("testBanner"), blocks }); }
function ownerDoc(test, blocks, oc) {
  /* oc = the E-11 alternative (copy + locale): own lang and dir; otherwise English, ltr, in every booking language */
  return oc ? edoc({ lang: oc.locale, dir: oc.locale === "ar" ? "rtl" : "ltr", test, banner: esc(oc.copy.testBanner), blocks })
            : edoc({ lang: "en", dir: "ltr", test, banner: co("testBanner"), blocks });
}
const greet = (name) => ep(fill(ce("greeting"), { name: esc(name) }));
const helpFoot = () => [erule(), enote(fill(ce("help"), { phone: ltrS(esc(D.contact.phone)) })), enote(ce("signOff"))];
const subjOf = (tpl, ref, test) => (test ? SUBJ_TEST : "") + fill(tpl, { ref });

function bookingRows(view) {
  const c = D.email[LOC], f = F();
  const rows = [
    [ce("rows.reference"), ltrS(esc(view.ref))],
    [ce("rows.stay"), fill(ce("stayLine"), { title: esc(view.stay.title), destination: esc(view.stay.destinationName) })],
    [ce("rows.dates"), ltrS(f.days)],
    [ce("rows.nights"), f.nights],
    [ce("rows.guests"), esc(f.guests)],
  ];
  if (view.lines.length) rows.push([ce("rows.addons"), view.lines.map((l) => fill(ce("addonLine"), { name: esc(l.name), quantity: ltrS(l.quantity), amount: ltrS(aed(l.lineFils)) })).join("<br>")]);
  if (view.airport) rows.push([ce("rows.airport"), esc(c.airports[view.airport])]);
  rows.push([ce("rows.plan"), ce("plans." + view.plan)]);
  rows.push([ce("rows.total"), ltrS(aed(view.money.grandFils))]);
  return erows(rows);
}
const payByP = (iso) => { const u = uae(iso); return ep(fill(cs("payBy"), { date: ltrS(u.date), time: ltrS(u.time) })); };
function transferBlockE(view, opts = {}) {
  const t = view.transfer, out = [erule(), eh(ce("transfer.heading"))];
  out.push(erows([
    [ce("transfer.amount"), ltrS(aed(t.amountFils))],
    [ce("transfer.accountName"), esc(t.accountName)],
    [ce("transfer.bankName"), esc(t.bankName)],
    [ce("transfer.iban"), ltrS(IBAN_SHOWN)],
    [ce("transfer.swift"), ltrS(esc(t.swift))],
    [ce("transfer.bankAddress"), esc(t.bankAddress)],
    [ce("transfer.currency"), ltrS(esc(t.currency))],
    [ce("transfer.note"), esc(t.note)],
  ]));
  if (t.payBy) out.push(payByP(t.payBy));
  out.push(ep(fill(ce("transfer.referenceLine"), { ref: ltrS(esc(view.ref)) })), ep(ce("transfer.fees")), ep(ce("transfer.reply")));
  if (opts.lapse) out.push(ep(ce("transfer.lapseRule")));
  out.push(ep(ce("transfer.alsoOnPage")));
  return out;
}
const balanceP = (amountFils, iso) => ep(fill(ce("balanceLine"), { amount: ltrS(aed(amountFils)), date: ltrS(dmy(iso)) }));

function requestReceivedMail(job) {
  const v = job.view, c = D.email[LOC];
  const blocks = [eh(ce("requestReceived.heading")), greet(v.guest.name), ep(fill(ce("requestReceived.intro"), { ref: ltrS(v.ref) })), bookingRows(v)];
  blocks.push(...transferBlockE(v, { lapse: true }));
  if (v.plan === "deposit" && v.money.balanceFils > 0 && v.balanceDueDate) blocks.push(balanceP(v.money.balanceFils, v.balanceDueDate));
  blocks.push(ep(ce("requestReceived.confirmNote")), ebtn(ce("buttons.viewBooking")), ...helpFoot());
  return { subject: subjOf(c.requestReceived.subject, v.ref, job.isTest), to: v.guest.email, reply: D.contact.email, html: guestDoc(job.isTest, blocks) };
}
function receiptMail(job) {
  const v = job.view, c = D.email[LOC], after = job.statusAfter, m = v.money;
  const closed = after === "expired" || after === "cancelled";
  const blocks = [eh(ce("paymentReceipt.heading")), greet(v.guest.name)];
  if (!closed) blocks.push(ep(fill(ce("paymentReceipt.intro"), { ref: ltrS(v.ref) })));
  const rows = [[ce("paymentReceipt.amountReceived"), ltrS(aed(job.amountFils))], [ce("paymentReceipt.receivedOn"), ltrS(dmy(job.receivedOn))]];
  if (!closed) rows.push([ce("paymentReceipt.totalPaid"), ltrS(aed(m.paidFils))]);
  blocks.push(erows(rows));
  if (closed) blocks.push(ep(fill(ce("paymentReceipt.moneyOnClosed"), { amount: ltrS(aed(job.amountFils)) })));
  else if (after === "awaiting_payment") {
    blocks.push(ep(ce("paymentReceipt.partReceived")), erows([[ce("paymentReceipt.stillDue"), ltrS(aed(m.dueNowFils))]]));
    blocks.push(...transferBlockE(v));
  } else if (m.stillDueFils > 0) {
    if (v.balanceDueDate) blocks.push(balanceP(m.stillDueFils, v.balanceDueDate));
    if (v.transfer) blocks.push(...transferBlockE(v));
  } else {
    if (v.flags.writtenOff) blocks.push(ep(ce("paymentReceipt.acceptedAsPaid")));
    if (v.flags.overpaid) blocks.push(ep(ce("paymentReceipt.overpaid")));
    blocks.push(ep(ce("paymentReceipt.nothingMoreDue")));
  }
  if (typeof job.bookingUrl === "string") blocks.push(ebtn(ce("buttons.viewBooking"))); else blocks.push(ep(ce("paymentReceipt.noLink")));
  blocks.push(...helpFoot());
  return { subject: subjOf(c.paymentReceipt.subject, v.ref, job.isTest), to: v.guest.email, reply: D.contact.email, html: guestDoc(job.isTest, blocks) };
}
function lapsedMail(job) {
  const c = D.email[LOC], u = uae(job.deadline);
  const blocks = [eh(ce("requestLapsed.heading")), greet(job.guestName),
    ep(fill(ce("requestLapsed.body"), { date: ltrS(u.date), time: ltrS(u.time), ref: ltrS(job.ref) })),
    ep(ce("requestLapsed.startAgainLine")), ebtn(ce("buttons.startAgain")), ...helpFoot()];
  return { subject: subjOf(c.requestLapsed.subject, job.ref, job.isTest), to: job.email, reply: D.contact.email, html: guestDoc(job.isTest, blocks) };
}

  const rows = ownerRowsBase(v, O, "en", f, ltr);
  rows.push([O.rows.amount, aed(job.amountFils)], [O.rows.receivedOn, dmy(job.receivedOn)], [O.rows.recordedBy, esc(job.recordedByEmail || O.notRecorded)],
    [O.rows.statusChange, fill(esc(O.statusChangeValue), { before: esc(O.statusWords[job.statusBefore]), after: esc(O.statusWords[job.statusAfter]) })],
    [O.rows.paidTotal, aed(v.money.paidFils)], [O.rows.stillDue, aed(v.money.stillDueFils)],
    [O.rows.attention, job.attentionReason ? esc(O.attentionWords[job.attentionReason]) : esc(O.none)]);
  const blocks = [eh(esc(O.payment.heading)), ep(esc(O.payment.intro)), erows(rows), ep(esc(O.replyNote)), dashLink(O, v.ref)];
  return { subject: (job.isTest ? SUBJ_TEST : "") + fill(O.payment.subject, { ref: v.ref }), to: D.contact.email, reply: v.guest.email + " (guest)", html: ownerDoc(job.isTest, blocks) };
}
function withdrawnOwnerMail(job) {
  const O = D.owner, v = job.view, f = D.fmt.en;
  const rows = [[O.rows.reference, esc(v.ref)], [O.rows.guest, esc(v.guest.name)], [O.rows.stay, fill(esc(O.stayValue), { title: esc(v.stay.title), slug: esc(v.stay.slug) })], [O.rows.dates, f.days]];
  const blocks = [eh(esc(O.withdrawn.heading)), erows(rows), ep(esc(O.withdrawn.line)), dashLink(O, v.ref)];
  return { subject: (job.isTest ? SUBJ_TEST : "") + fill(O.withdrawn.subject, { ref: v.ref }), to: D.contact.email, reply: v.guest.email + " (guest)", html: ownerDoc(job.isTest, blocks) };
}

function transferBlockP(o, view, model) {
  const t = model.transfer, P = D.page[LOC];
  let when;
  if (model.partPaidLate) { const u = uae(view.deadline); when = `<p class="late" data-id="deadline-passed">${fill(cp("partPaidLate"), { date: ltrB(u.date), time: ltrB(u.time) })}</p>`; }
  else if (t.kind === "deadline" && t.payBy) { const u = uae(t.payBy); when = `<p class="pay-by">${fill(cs("payBy"), { date: ltrB(u.date), time: ltrB(u.time) })}</p>`; }
  else if (t.kind === "balance" && t.dueBy) when = `<p class="pay-by">${fill(cp("transfer.dueBy"), { date: ltrB(dmy(t.dueBy)) })}</p>`;
  else when = "";
  const tr = view.transfer;
  const cpy = (l) => (o.print ? "" : ` ${btn("secondary", l, { sm: 1, cls: "cpb" })}`);
  return `<section class="block tb" data-id="transfer"><h2 class="disp h2">${cp("transfer.heading")}</h2>
    <p class="amt">${cp("transfer.amount")}: <b>${ltrB(aed(t.amountFils))}</b></p>${when}
    <dl class="dl">
      ${dlRow(cp("transfer.reference"), ltrB(esc(view.ref)), cpy(P.copyValue.copyReference))}
      ${dlRow(cp("transfer.accountName"), esc(tr.accountName))}
      ${dlRow(cp("transfer.bankName"), esc(tr.bankName))}
      ${dlRow(cp("transfer.iban"), ltrB(IBAN_SHOWN), cpy(P.copyValue.copyIban))}
      ${dlRow(cp("transfer.swift"), ltrB(esc(tr.swift)))}
      ${dlRow(cp("transfer.bankAddress"), esc(tr.bankAddress))}
      ${dlRow(cp("transfer.currency"), ltrB(esc(tr.currency)))}
      ${dlRow(cp("transfer.note"), esc(tr.note))}
    </dl>
    <p>${fill(cp("transfer.referenceLine"), { ref: ltrB(esc(view.ref)) })}</p><p>${cp("transfer.fees")}</p><p>${cp("transfer.reply")}</p><p class="muted">${cp("transfer.alsoInEmail")}</p></section>`;

function page(o) {
  /* o: { kind: loading|ready|not_found|unavailable, view, ui, test, signIn, back, print } */
  const P = D.page[LOC], S = D.status[LOC];
  const head = (inner) => `<div class="pg1${o.print ? " printmode" : ""}">${o.test ? testBanner() : ""}${inner}</div>`;
  if (o.kind === "loading") return head(`<h1 class="disp h1">${cp("heading")}</h1><p role="status">${cp("loading")}</p>`);
  if (o.kind === "noscript") return head(`<h1 class="disp h1">${cp("heading")}</h1><p>${cp("noscript")}</p>`);
  if (o.kind === "unavailable") return head(`<h1 class="disp h1">${cp("heading")}</h1><p>${ICW.replace("<svg", '<svg style="vertical-align:-3px;margin-inline-end:6px"')}${cp("unavailable")}</p><p>${btn("secondary", cp("tryAgain"))}</p>`);
  if (o.kind === "not_found") return head(`<h1 class="disp h1">${cp("heading")}</h1><p>${cp("notFound")}</p>${o.signIn ? `<p>${cp("notFoundSignIn")}</p><p><a class="link">${cp("logIn")}</a></p>` : ""}`);
  const v = o.view;
  const model = o.model, f = F();
  const ui = o.ui || { step: "idle" };
  const refused = ui.step === "refused";
  /* main column */
  const main = [];
  main.push(`<dl class="dl facts">${dlRow(cp("dates"), `${ltrB(f.days)} · ${esc(f.nightsPage)}`)}${dlRow(cp("guests"), esc(f.guests))}</dl>`);
  if (model.notSent) { const u = uae(v.holdExpiresAt); main.push(`<div class="line"><p>${cp("notSent.line")}</p><p>${fill(cp("notSent.heldUntil"), { date: ltrB(u.date), time: ltrB(u.time) })}</p><a class="link">${cp("notSent.finish")}</a></div>`); }
  if (model.status === "expired") main.push(`<div class="line"><p>${cp("expired.line")}</p><a class="link">${cp("expired.startAgain")}</a></div>`);
  if (model.partReceived) main.push(`<p class="line">${cp("flags.partReceived")}</p>`);
  if (model.acceptedAsPaid) main.push(`<p class="line">${cp("flags.acceptedAsPaid")}</p>`);
  if (model.overpaid) main.push(`<p class="line">${cp("flags.overpaid")}</p>`);
  if (model.moneyOnClosed) main.push(`<p class="line">${fill(cp("flags.moneyOnClosed"), { amount: ltrB(aed(v.money.paidFils)) })}</p>`);
  if (model.balanceLine) main.push(`<p class="line">${fill(cp("money.balanceLine"), { amount: ltrB(aed(model.balanceLine.amountFils)), date: ltrB(dmy(model.balanceLine.dueDate)) })}</p>`);
  if ((model.partPaidContact || model.ownerMadeContact) && !refused) main.push(contactLine());
  if (model.transfer) main.push(transferBlockP(o, v, model));
  if (o.withdraw && model.canWithdraw && ["idle", "confirm", "failed"].includes(ui.step) && !o.print)
    main.push(`<section class="sec" data-id="withdraw-section"><p>${cp("withdrawHint")}</p>${btn("secondary", cp("withdrawAction"), { cls: "wd" })}</section>`);
  if (v.payments.length) {
    main.push(`<section class="sec"><h2 class="disp h2">${cp("payments.heading")}</h2><ul class="cards2">${v.payments.map((p) => `<li><span>${p.receivedOn ? ltrB(dmy(p.receivedOn)) : cp("payments.dateNotRecorded")}</span><span>${p.method === "bank_transfer" ? cp("payments.bankTransfer") : cp("payments.other")}</span><b>${ltrB(aed(p.amountFils))}</b></li>`).join("")}</ul></section>`);
  }
  main.push(`<section class="sec"><h2 class="disp h2">${cp("travellers.heading")}</h2><ul class="plain">${v.travellers.map((t) => {
    const kind = t.kind === "adult" ? cp("travellers.adult") : fill(t.kind === "child" ? cp("travellers.child") : cp("travellers.infant"), { age: ltrB(t.age) });
    return `<li><span>${esc(t.fullName)}</span> <span class="muted">${kind}${t.isBooker ? " · " + cp("travellers.booker") : ""}${t.notStaying ? " · " + cp("travellers.notStaying") : ""}</span></li>`;
  }).join("")}</ul></section>`);
  if (v.lines.length) main.push(`<section class="sec"><h2 class="disp h2">${cp("addons.heading")}</h2><ul class="plain">${v.lines.map((l) => `<li>${fill(cp("addons.line"), { name: esc(l.name), quantity: ltrB(l.quantity) })} <b>${ltrB(aed(l.lineFils))}</b></li>`).join("")}</ul></section>`);
  if (v.airport) main.push(`<section class="sec"><h2 class="disp h2">${cp("airport.heading")}</h2><p>${esc(D.page[LOC].airport.names[v.airport])}</p>${v.pickupAddress ? `<p class="muted">${cp("airport.pickup")}: ${esc(v.pickupAddress)}</p>` : ""}</section>`);
  /* side column */
  const side = [];
  const acc = v.access;
  side.push(`<section class="block"><h2 class="disp h2">${cp("stay")}</h2><div class="img" aria-hidden="true"></div><p><b>${esc(v.stay.title)}</b><br><span class="muted">${esc(v.stay.destinationName)}</span></p>${
    model.showAccess ? `<div data-id="access"><h3 class="disp h2" style="font-size:16px">${cp("arrival.heading")}</h3><dl class="dl">${dlRow(cp("arrival.address"), esc(acc.address))}${dlRow(cp("arrival.wifiName"), esc(acc.wifiName))}${dlRow(cp("arrival.wifiPassword"), esc(acc.wifiPassword))}${dlRow(cp("arrival.doorCode"), esc(acc.doorCode))}${dlRow(cp("arrival.notes"), esc(acc.notes))}</dl></div>`
    : model.addressPending ? `<p class="muted">${cp("addressPending")}</p>` : ""}</section>`);
  const mo = v.money;
  const sum = [dlRow(cp("money.nights"), ltrB(aed(mo.nightsFils))), dlRow(cp("money.addons"), ltrB(aed(mo.addonsFils))), dlRow(cp("money.subtotal"), ltrB(aed(mo.subtotalFils))), dlRow(cp("money.vat"), ltrB(aed(mo.vatFils))), `<dt class="tot">${cp("money.total")}</dt><dd class="tot">${ltrB(aed(mo.grandFils))}</dd>`,
    dlRow(cp("money.plan"), v.plan === "deposit" ? cp("money.planDeposit") : cp("money.planFull"))];
  if (v.plan === "deposit") sum.push(dlRow(cp("money.depositAmount"), ltrB(aed(mo.depositFils))));
  sum.push(dlRow(cp("money.paid"), ltrB(aed(mo.paidFils))));
  sum.push(model.nothingMoreDue ? `<dt>${cp("money.stillDue")}</dt><dd>${cp("money.nothingMoreDue")}</dd>` : dlRow(cp("money.stillDue"), ltrB(aed(mo.stillDueFils))));
  side.push(`<section class="block"><h2 class="disp h2">${cp("money.heading")}</h2><dl class="dl">${sum.join("")}</dl></section>`);
  side.push(`<section class="block"><h2 class="disp h2">${cp("concierge.heading")}</h2><p>${cp("concierge.line")}</p><p class="row gx4"><a class="link" href="${WA_URL}">${cp("concierge.whatsapp")}</a><a class="link" href="mailto:${esc(D.contact.email)}">${cp("concierge.email")}</a></p></section>`);
  const topRow = `${o.back ? `<p><a class="link">‹ ${cp("backToBookings")}</a></p>` : ""}<h1 class="disp h1">${cp("heading")}</h1><p class="row gx4 refrow"><span class="kick">${cp("reference")}</span> ${ltrB(esc(v.ref))}<span class="chip">${cs(v.status)}</span></p>`;
  return head(`${withdrawNotice(ui)}${topRow}<div class="pg"><div class="stack g4">${main.join("")}</div><div class="stack g4">${side.join("")}</div></div>`);
}

  { id: "e26", h: "E-26 · Withdraw failed, try again", sig: "approve", q: "On a network failure the dialog stays open with a failure line and a safe Try again. Approve or change?", ids: ["withdraw-failed"] },
  { id: "e27", h: "E-27 · Part-paid page", sig: "approve", q: "Once some money is recorded there is no Withdraw button, only the line to contact you to change or cancel. Approve or change?", ids: ["part-received"] },
  { id: "e28", h: "E-28 · Part-paid page after the pay-by date", sig: "approve", q: "After the pay-by date a part-paid request keeps its bank details, says the date has passed, the nights are still held and you will contact the guest. Approve or change?", ids: ["part-paid-late"] },
  { id: "e29", h: "E-29 · No guest email on a withdraw", sig: "approve", q: "A withdraw sends no email to the guest; the page shows the result at once and only you get a notice. Recommended: approve.", ids: ["withdraw-done"] },
  { id: "e30", h: "E-30 · Owner notice of a withdrawal", sig: "approve", q: "You get an English notice with the reference, guest, stay, dates, 'The nights are free again.' and the dashboard link. Approve or change?", ids: ["withdrawn-owner"] },
  { id: "e31", h: "E-31 · One receipt per payment", sig: "approve", q: "Each recorded payment gets its own receipt; here are two receipts for two payments on one request. Approve or change?", ids: ["receipt-part", "receipt-part-2"] },
  { id: "oth", h: "Other states (no owner question of their own)", sig: "info", q: "The remaining emails and page states.", ids: ["receipt-deposit", "receipt-full", "receipt-no-link", "request-lapsed", "payment-owner", "payment-owner-deadline", "paid-full", "expired", "print-confirmed", "loading", "noscript", "not-found", "not-found-link", "unavailable"] },
];

/* ============================ RENDER ============================ */
const rendered = new Set();
function frameHTML(id, tag, locOv) {
  const s = STATES[id], saved = LOC;
  LOC = locOv || s.loc || LOC;
  try {
    const first = !rendered.has(id);
    rendered.add(id);
    const w = s.width || WIDTH;
    const mail = s.mail ? s.mail() : null;
    const body = mail ? mail.html : s.fn();
    const note = s.mail ? s.note : ((typeof s.note === "function" ? s.note() : s.note) || modelNote(s.mk)) + (s.extra ? "; " + s.extra : "");
    const meta = mail ? `<div class="meta"><span><b>Subject</b> ${esc(mail.subject)}</span> <span><b>To</b> ${esc(mail.to)}</span> <span><b>Reply-to</b> ${esc(mail.reply)}</span></div>` : "";
    const alt = s.alt ? `<div class="altflag">DRAWN ALTERNATIVE for the question. Model-translated Arabic, not signed, not in the copy files.</div>` : "";
    const isE = !!mail;
    return `<div class="fr"${first ? ` id="s-${id}"` : ""}><div class="cap"><code>${id}</code>${tag ? `<span class="opt${tag.startsWith("A") ? " rec" : ""}">${esc(tag)}</span>` : ""}<span class="rules">${esc(note)}</span></div>${meta}${alt}<div class="fw" data-w="${w}"><div class="frame" style="width:${w}px" lang="${LOC}" dir="${LOC === "ar" ? "rtl" : "ltr"}">${isE ? body : `<div class="inner">${body}</div>`}</div></div></div>`;
  } finally { LOC = saved; }
}
function render() {
  rendered.clear(); MISSING.clear();
  let html = `<div class="banner"><strong>04-05 pictures for signature (no shoot).</strong> Six booking emails (request received, payment receipt in six variants, request lapsed, and the owner's request, payment and withdrawn notices) and every guest booking page state. Every visible product string is read from lib/copy/booking-email.ts, lib/copy/booking-page.ts and JOURNEY_COPY bookingStatus (EN, AR right to left, ES), with the values of tests/helpers/booking-view-fixtures.ts; the page's blocks come from the real bookingPageModel run on those fixtures. Amounts are fixture test values in AED (repeating digits), not prices; the VAT line stays "[RATE]%"; names, stay and bank fields are bracket placeholders; the only IBAN is the documentation example AE07 0331 2345 6789 0123 456 with BIC TESTAEAAXXX. Stay photos are empty frames. The site navigation and footer (PublicFrame) are not drawn. Emails are drawn as 600 px tables: use width 600 to see one at its real size. A red MISSING COPY box marks a string the plan needs that does not exist. Nothing here is wired; AR and ES are drafts for the owner.</div>`;
  for (const g of GROUPS) {
    let inner = "";
    if (g.sig === "choice") {
      if (CMP) inner = `<div class="cmp">${g.opts.map(([id, tag, lo]) => frameHTML(id, tag, lo)).join("")}</div>`;
      else inner = g.opts.map(([id, tag, lo]) => frameHTML(id, tag, lo)).join("");
    } else {
      inner = g.ids.map((id) => (rendered.has(id) ? `<div class="stub"><code>${id}</code> already drawn: <a href="#s-${id}">jump to it</a>.</div>` : frameHTML(id))).join("");
    }
    html += `<section class="grpbox" id="g-${g.id}"><h2>${esc(g.h)}</h2>${g.sig === "choice" ? '<span class="tag">Owner signature: choose</span>' : g.sig === "approve" ? '<span class="tag">Owner signature: approve or change</span>' : ""}<p class="q">${esc(g.q)}</p>${inner}</section>`;
  }
  document.getElementById("main").innerHTML = html;
  document.getElementById("misslist").textContent = MISSING.size ? "MISSING COPY: " + [...MISSING].join(", ") : "";
  fit();
}
function fit() {
  const mainW = document.getElementById("main").clientWidth - 48;
  document.querySelectorAll(".fw").forEach((fw) => {
    const f = fw.firstElementChild, cmp = fw.closest(".cmp"), W = +fw.dataset.w;
    const avail = cmp ? (mainW - 20) / 2 : mainW;
    const sc = Math.min(1, avail / W);
    fw.style.width = Math.round(W * sc) + 2 + "px";
    f.style.transform = `scale(${sc})`;
    fw.style.height = Math.ceil(f.offsetHeight * sc) + 2 + "px";
  });
}
function buildIndex() {
  let h = "";
  for (const g of GROUPS) {
    h += `<h2>${esc(g.h.split(" · ")[0])}</h2><a href="#g-${g.id}">${esc(g.h.split(" · ").slice(1).join(" · ") || g.h)}</a>`;
    const ids = g.sig === "choice" ? g.opts.map((o) => o[0]) : g.ids;
    h += ids.map((id) => `<a class="st" href="#s-${id}">${id}</a>`).join("");
  }
  document.getElementById("index").innerHTML = h;
}
function setPressed() {
  document.querySelectorAll("#top [data-loc]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.loc === LOC));
  document.querySelectorAll("#top [data-w]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.w === WIDTH));
  document.getElementById("cmp").setAttribute("aria-pressed", CMP);
}
document.querySelectorAll("#top [data-loc]").forEach((b) => b.addEventListener("click", () => { LOC = b.dataset.loc; setPressed(); render(); }));
document.querySelectorAll("#top [data-w]").forEach((b) => b.addEventListener("click", () => { WIDTH = +b.dataset.w; setPressed(); render(); }));
document.getElementById("cmp").addEventListener("click", () => { CMP = !CMP; setPressed(); render(); });
window.addEventListener("resize", fit);
window.addEventListener("load", () => { fit(); setTimeout(fit, 400); });
buildIndex(); setPressed(); render();

</script></body></html>
