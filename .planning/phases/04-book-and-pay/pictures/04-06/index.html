<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMAR 04-06 pictures: after the request, and the guest's bookings list</title>
<style>
:root{
  --color-ivory:#fffaf0;--color-surface:#ffffff;--color-teal:#1f3b40;--color-teal-hover:#1b3438;--color-teal-press:#182d31;
  --color-teal-tint:#d1dfe0;--color-gold:#d4ba8a;--color-ink:#262626;--color-muted:#63615f;--color-line:rgb(38 38 38 / 0.16);
  --color-error:#8f2d2d;--color-success:#1e6b45;--color-warning:#8a3b12;--color-whatsapp:#25D366;
  --control:44px;--chip:40px;--chip-dense:24px;--action:56px;--dock:88px;--mark:28px;--row:56px;
  --container-column:1240px;--container-rail:400px;--container-dialog:480px;
  --radius-control:0;--radius-overlay:0;
  --shadow-lg:0 28px 56px -16px rgb(10 9 7 / 0.28),0 10px 20px -10px rgb(10 9 7 / 0.12);
  --shadow-rule-primary:inset 0 -3px 0 var(--color-teal);
  --face-display:Georgia,"Times New Roman",serif;
  --face-body:"Lato",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --tracking-kicker:0.12em;--tracking-display:-0.02em;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:#ece8df;color:var(--color-ink);font-family:var(--face-body);font-size:14px}
/* ---------- review page chrome (not product UI) ---------- */
#top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:10px 20px;background:var(--color-teal);color:var(--color-ivory)}
#top h1{font:400 18px var(--face-display);margin:0;margin-inline-end:auto}
#top .grp{display:flex;align-items:center;gap:6px}
#top .grp span.l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-inline-end:4px}
#top button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid rgba(255,250,240,.5);background:transparent;color:var(--color-ivory);cursor:pointer}
#top button[aria-pressed=true]{background:var(--color-ivory);color:var(--color-teal);border-color:var(--color-ivory)}
#wrap{display:flex;align-items:flex-start}
#index{position:sticky;top:52px;align-self:flex-start;width:268px;flex:none;height:calc(100vh - 52px);overflow:auto;background:var(--color-ivory);border-inline-end:1px solid var(--color-line);padding:14px 14px 40px;font-size:13px}
#index h2{font:400 12px var(--face-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-muted);margin:16px 0 4px}
#index a{display:block;color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-underline-offset:3px;padding:2px 0}
#index a.st{margin-inline-start:12px;text-decoration:none;color:var(--color-ink)}
#index a.st:hover{text-decoration:underline;text-decoration-color:var(--color-gold)}
#main{flex:1;min-width:0;padding:20px 24px 80px}
.banner{background:var(--color-ivory);border:1px solid var(--color-gold);padding:10px 14px;margin-bottom:20px;font-size:13px;line-height:1.5}
.banner p{margin:0 0 6px}.banner p:last-child{margin:0}
.grpbox{margin:0 0 44px}
.grpbox>h2{font:400 22px var(--face-display);color:var(--color-teal);margin:0 0 4px}
.grpbox>.q{margin:0 0 4px;font-size:14px;line-height:1.5;max-width:900px}
.grpbox>.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--color-teal);color:var(--color-teal);padding:2px 8px;margin-bottom:8px}
.fr{margin:14px 0 26px}
.cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.cap code{font:600 13px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);padding:2px 6px}
.cap .opt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-teal)}
.cap .opt.rec{font-weight:700}
.cap .rules{font-size:12px;color:var(--color-muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.fw{position:relative;overflow:hidden;border:1px solid var(--color-line);background:var(--color-ivory)}
.stub{border:1px dashed var(--color-muted);padding:10px 14px;font-size:13px;background:#fff}
.stub a{color:var(--color-teal)}
.miss{background:#fde8e8;border:2px solid #c00000;color:#8b0000;font:600 12px ui-monospace,Menlo,monospace;padding:4px 8px;direction:ltr;text-align:left;display:inline-block}
#misslist{flex-basis:100%;font:600 12px ui-monospace,Menlo,monospace;color:#ffb4b4}
#misslist:empty{display:none}
.urlbar{font:12px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--color-line);border-bottom:0;padding:6px 10px;max-width:900px;direction:ltr;text-align:left}
table.dr{border-collapse:collapse;width:100%;background:#fff;font-size:13px;line-height:1.5}
table.dr th,table.dr td{border:1px solid var(--color-line);padding:6px 8px;vertical-align:top;text-align:start}
table.dr th{font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-muted);background:var(--color-ivory)}
table.dr td.k{font:12px ui-monospace,Menlo,monospace;white-space:nowrap}
table.dr td.ar{font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.7}
table.dr .src{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-teal)}

/* ---------- product frame: tokens.json values, component class strings mirrored ---------- */
.frame{container:frame / inline-size;position:relative;transform-origin:top left;background:var(--color-ivory);color:var(--color-ink);font-family:var(--face-body);font-size:14px;line-height:1.43;padding-bottom:1px}
.frame[dir=rtl]{font-family:"Noto Sans Arabic","Noto Sans",var(--face-body);line-height:1.63}
.frame[dir=rtl] .disp{font-family:"Noto Naskh Arabic","Noto Sans Arabic",var(--face-display)}
.frame p,.frame h1,.frame h2,.frame h3,.frame dl,.frame dd,.frame ol,.frame ul{margin:0}
.frame ol,.frame ul{padding:0;list-style:none}
.disp{font-family:var(--face-display);font-weight:400}
.t-cap{font-size:12px;line-height:1.5}.t-label{font-size:14px;line-height:1.43}.t-body{font-size:16px;line-height:1.5}
.t-title{font-size:20px;line-height:1.3}.t-heading{font-size:32px;line-height:1.2}.t-display{font-size:48px;line-height:1.1;letter-spacing:var(--tracking-display)}
.frame[dir=rtl] .t-cap{line-height:1.7}.frame[dir=rtl] .t-label{line-height:1.63}.frame[dir=rtl] .t-body{line-height:1.7}
.frame[dir=rtl] .t-title{line-height:1.5}.frame[dir=rtl] .t-heading{line-height:1.4}.frame[dir=rtl] .t-display{line-height:1.3;letter-spacing:0}
.teal{color:var(--color-teal)}.muted{color:var(--color-muted)}.ink{color:var(--color-ink)}
.kick{font-size:12px;line-height:1.5;text-transform:uppercase;letter-spacing:var(--tracking-kicker);color:var(--color-muted)}
.frame[dir=rtl] .kick,.frame[dir=rtl] .up{text-transform:none;letter-spacing:0}
.up{text-transform:uppercase;letter-spacing:var(--tracking-kicker)}
.stack{display:flex;flex-direction:column}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g6{gap:24px}.g8{gap:32px}
.row{display:flex;flex-wrap:wrap;align-items:center}.gx2{gap:8px}.gx3{gap:12px}.gx4{gap:16px}
.start{align-items:flex-start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab-num{font-variant-numeric:tabular-nums}
svg.i{flex:none}
/* buttons (components/ui/button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;flex-shrink:0;height:var(--control);padding:0 24px;border:1px solid transparent;font:inherit;font-size:14px;line-height:1.43;cursor:pointer;background:transparent;text-decoration:none}
.btn.lg{height:var(--action);padding:0 32px}
.btn.full{width:100%}
.btn-primary{background:var(--color-teal);color:var(--color-ivory);border-color:var(--color-teal)}
.btn-secondary{background:transparent;color:var(--color-teal);border-color:var(--color-teal)}
.btn-ghost{background:transparent;color:var(--color-teal);border-color:transparent;padding:0 16px}
.btn:disabled,.btn.dis{background:var(--color-ivory);border-color:var(--color-line);color:var(--color-muted);cursor:default}
.link{color:var(--color-teal);text-decoration:underline;text-decoration-color:var(--color-gold);text-decoration-thickness:1px;text-underline-offset:4px;display:inline-flex;align-items:center;min-height:32px}
/* nav (components/ui/nav.tsx; @6xl = 1152px) */
.nav{position:relative;width:100%;border-bottom:1px solid var(--color-line);background:var(--color-ivory);color:var(--color-ink)}
.navrow{display:flex;width:100%;align-items:center;gap:16px;padding:8px 12px}
.logo{display:inline-flex;min-height:var(--control);align-items:center;color:var(--color-ink)}
.logo svg{display:block;width:112px;height:auto;aspect-ratio:2845/2153}
.menu{margin-inline-start:auto;display:inline-flex;height:var(--control);align-items:center;padding:0 16px;border:1px solid var(--color-muted);background:var(--color-surface);color:var(--color-ink);font:inherit;font-size:14px;text-transform:uppercase;letter-spacing:var(--tracking-kicker)}
.frame[dir=rtl] .menu{text-transform:none;letter-spacing:0}
.navfull{display:none}
.nlink{display:inline-flex;min-height:var(--control);align-items:center;white-space:nowrap;padding:0 12px;font-size:12px;text-transform:uppercase;letter-spacing:var(--tracking-kicker);color:inherit;text-decoration:none}
.frame[dir=rtl] .nlink{text-transform:none;letter-spacing:0}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:var(--control);min-width:96px;padding:0 16px;border:1px solid var(--color-muted);background:var(--color-surface);font-size:12px;text-transform:uppercase;letter-spacing:var(--tracking-kicker);color:var(--color-ink)}
.acct{display:inline-flex;height:var(--control);max-width:240px;align-items:center;gap:8px;border:1px solid var(--color-muted);background:var(--color-surface);padding-inline:16px 12px;font-size:14px}
@container frame (min-width:1152px){
  .navrow{gap:32px;padding:8px 24px}.logo svg{width:150px}.menu{display:none}
  .navfull{display:flex;flex:1;align-items:center;gap:32px;min-width:0}
  .navfull nav{display:flex;align-items:center;gap:12px}
  .navfull .tools{display:flex;align-items:center;gap:16px;margin-inline-start:auto}
  .navfull .tools .nlink{margin-inline-start:8px}
}
/* WhatsApp float (components/ui/whatsapp.tsx): drawn at the frame's bottom end */
.wa{position:absolute;inset-inline-end:16px;bottom:16px;z-index:5;display:inline-flex;width:var(--control);height:var(--control);align-items:center;justify-content:center;background:var(--color-whatsapp);color:var(--color-ink)}
.wa.dock{bottom:var(--dock)}
@container frame (min-width:768px){.wa.dock{bottom:16px}}
.footstub{margin-top:48px;border-top:1px solid var(--color-line);padding:16px;text-align:center;font-size:12px;color:var(--color-muted)}
/* PageShell + TripLayout */
.shell{width:100%;padding:48px 16px}
.col{margin:0 auto;width:100%;max-width:var(--container-column)}
.trip{display:flex;flex-direction:column;gap:24px}
.rail{display:none;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--color-line)}
.rail li{padding-bottom:16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--color-teal)}
.rail li.cur{box-shadow:var(--shadow-rule-primary)}
.mark{display:inline-flex;width:var(--mark);height:var(--mark);flex:none;align-items:center;justify-content:center}
.mark.done{background:var(--color-teal);color:var(--color-ivory)}
.mark.cur{border:1px solid var(--color-teal);color:var(--color-teal);font-size:12px}
.prail{display:flex;flex-direction:column;gap:8px}
.prail ol{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.prail li{height:3px;background:var(--color-teal)}
.tcols{display:flex;flex-direction:column;gap:32px}
.tmain{min-width:0;flex:1}
.tcart{width:100%}
@container frame (min-width:768px){
  .shell{padding-inline:32px}
  .rail{display:grid}.prail{display:none}
  .tcols{flex-direction:row;align-items:flex-start}
  .tcart{width:auto;flex-shrink:0}
  .tcart .cart{width:var(--container-rail)}
}
/* journey-cart rail */
.cart{background:var(--color-surface);border:1px solid var(--color-line);padding:24px;display:flex;flex-direction:column;gap:16px}
.crow{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.crow.b{font-weight:700}
.cline{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--color-line);font-size:14px;font-variant-numeric:tabular-nums}
/* request-step + request-sent (planned) */
.rs{container:rs / inline-size;display:flex;flex-direction:column;gap:24px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;background:var(--color-teal-tint);padding:16px 24px;color:var(--color-teal)}
.box{display:flex;flex-direction:column;gap:12px;border:1px solid var(--color-line);background:var(--color-surface);padding:16px}
.rdl{display:grid;grid-template-columns:1fr;gap:12px}
.rdl dt{font-size:12px;line-height:1.5;color:var(--color-muted)}
.rdl dd{display:flex;flex-direction:column}
.rdl dd.terms{flex-direction:row;align-items:center;gap:8px}
.chk{display:inline-grid;width:20px;height:20px;flex:none;place-items:center;background:var(--color-teal);color:var(--color-ivory)}
@container rs (min-width:512px){.rdl{grid-template-columns:repeat(3,1fr);column-gap:16px}.rdl dt{font-size:14px}.rdl dd{grid-column:span 2}.rdl dd.terms{grid-column:2 / span 2}}
.next li{display:flex;gap:8px;border-inline-start:2px solid var(--color-gold);padding-inline-start:12px;font-size:16px;line-height:1.5}
.frame[dir=rtl] .next li{line-height:1.7}
.reason{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--color-error);border-inline-start-width:4px;background:var(--color-surface);padding:12px 16px;font-size:14px;color:var(--color-ink)}
.reason>svg{color:var(--color-error);margin-top:2px}
.reason>span{display:flex;min-width:0;flex:1;flex-direction:column;align-items:flex-start}
.busy{display:flex;align-items:center;gap:12px;background:var(--color-teal-tint);padding:16px;font-size:14px;color:var(--color-teal)}
.busy i{display:inline-block;width:16px;height:16px;flex:none;border:1px solid var(--color-teal)}
/* bookings list (planned) */
.lmain{margin:0 auto;box-sizing:border-box;display:grid;width:100%;max-width:var(--container-column);justify-items:start;gap:24px;padding:48px 16px}
@container frame (min-width:768px){.lmain{padding-inline:32px}}
@container frame (min-width:1024px){.lmain{padding-inline:64px}}
.startlink{display:inline-flex;height:var(--control);align-items:center;justify-content:center;border:1px solid var(--color-teal);padding:0 24px;color:var(--color-teal);text-decoration:none;text-transform:uppercase;letter-spacing:var(--tracking-kicker);font-size:14px}
.frame[dir=rtl] .startlink{text-transform:none;letter-spacing:0}
.tabs{display:flex;width:100%;gap:8px;border-bottom:1px solid var(--color-line)}
.tab{display:inline-flex;height:var(--control);align-items:center;padding:0 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:inherit;font-size:14px;color:var(--color-muted);text-transform:uppercase;letter-spacing:var(--tracking-kicker);cursor:pointer}
.frame[dir=rtl] .tab{text-transform:none;letter-spacing:0}
.tab[aria-selected=true]{color:var(--color-teal);border-bottom-color:var(--color-gold)}
.panel{width:100%;display:flex;flex-direction:column;gap:16px}
.gcard{display:grid;grid-template-columns:1fr;border:1px solid var(--color-line);background:var(--color-surface)}
.gph{aspect-ratio:16/9}
.photo{width:100%;height:100%;display:flex;align-items:flex-end;padding:8px 12px;background:linear-gradient(135deg,#3d5a5e 0%,#1f3b40 55%,#262626 100%);color:var(--color-ivory);font-size:12px}
.tint{width:100%;height:100%;background:var(--color-teal-tint)}
.gbody{display:flex;flex-direction:column;gap:8px;padding:16px;min-width:0}
.schip{display:inline-flex;align-items:center;height:var(--chip-dense);padding:0 8px;border:1px solid var(--color-teal);color:var(--color-teal);font-size:12px;white-space:nowrap}
.gm{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:14px;font-variant-numeric:tabular-nums;padding-top:8px;border-top:1px solid var(--color-line)}
.gm dt{color:var(--color-muted)}
.gm .nd{grid-column:1 / -1;color:var(--color-ink)}
.gact{padding-top:8px}
@container frame (min-width:768px){.gcard{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.gph{aspect-ratio:auto;min-height:100%}}
/* sign-in page (app/[locale]/login: AuthFrame + SignInScreen) */
.auth{display:flex;flex-direction:column;min-height:780px;background:var(--color-ivory)}
.aimg{position:relative;height:320px;flex:none;overflow:hidden;background:linear-gradient(160deg,#3d5a5e 0%,#1f3b40 60%,#262626 100%)}
.aimg .ov{position:absolute;inset:0;background:rgb(38 38 38 / .3)}
.aimg .top{position:absolute;inset-inline:16px;top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.aimg .top .logo{color:var(--color-ivory)}
.aimg .top .sel{background:transparent;color:var(--color-ivory);border-color:rgb(255 250 240 / .7)}
.aimg .ph{position:absolute;inset-inline-end:16px;top:72px;font-size:12px;color:var(--color-ivory);opacity:.8}
.aimg .brand{position:absolute;inset-inline:16px;bottom:24px;display:grid;gap:12px;color:var(--color-ivory)}
.amain{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding:32px 16px}
.amain .lgrow{display:none;align-items:center;justify-content:space-between;gap:16px}
.aform{display:grid;width:100%;max-width:432px;gap:24px}
.field{display:grid;gap:8px}
.inp{display:block;width:100%;min-height:var(--control);border:1px solid var(--color-ink);background:var(--color-surface);padding:8px 16px;font:inherit;font-size:14px;color:var(--color-muted);direction:ltr;text-align:left}
.goldrule{display:block;width:40px;border-top:1px solid var(--color-gold)}
@container frame (min-width:768px){.aimg{height:384px}.aimg .top{inset-inline:32px;top:24px}.aimg .brand{inset-inline:32px;bottom:32px}.amain{padding-inline:32px}}
@container frame (min-width:1024px){
  .auth{flex-direction:row}
  .aimg{order:2;margin:16px;height:auto;flex:1}.aimg .top{display:none}.aimg .brand{inset-inline:48px;bottom:48px}.aimg .ph{top:16px}
  .amain{order:1;width:560px;flex:none;padding-inline:64px}
  .amain .lgrow{display:flex}.amain .lgrow .logo svg{width:150px}

const LOCS = ["en", "ar", "es"];
let LOC = "en", WIDTH = 1440;
const MISSING = new Set();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const get = (root, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), root);
const missBox = (p) => { MISSING.add(p); return `<span class="miss">MISSING COPY: ${esc(p)}</span>`; };
const t = (p) => { const v = get(D[LOC], p); return typeof v === "string" && v.trim() ? esc(v) : missBox(p); };
/* plural forms with a symbolic count: the "other" form, # replaced by [N] */
const pl = (p) => { const v = get(D[LOC], p); return v && typeof v.other === "string" ? esc(v.other).replace(/#/g, "[N]") : missBox(p); };
const B = (x) => `<bdi dir="ltr">${x}</bdi>`;
const AMT = "AED [AMOUNT]", DATE = "[DD/MM/YYYY]", TIME = "[HH:MM]", RANGE = "[DD/MM/YYYY] – [DD/MM/YYYY]";
const STAY = "[Stay name]", PLACE = "[Destination]", REF = "ALMAR-7K3QH9";
const WA_URL = "https://wa.me/971563883302";
const payBy = () => fill(t("bookingStatus.payBy"), { date: B(DATE), time: B(TIME) });

const IC = {

};
const logo = () => `<a class="logo" aria-label="ALMAR Private Journeys home"><svg role="img" aria-label="ALMAR Private Journeys"><use href="#almar-logo"/></svg></a>`;
const btn = (kind, label, o = {}) => `<button type="button" class="btn btn-${kind}${kind === "primary" || kind === "secondary" ? " up" : ""}${o.cls ? " " + o.cls : ""}"${o.disabled ? " disabled" : ""}>${label}</button>`;
const linkBtn = (label, href) => `<a class="btn btn-primary up" href="${href}">${label}</a>`;
const wa = (dock) => `<a class="wa${dock ? " dock" : ""}" aria-label="WhatsApp" href="${WA_URL}">${IC.wa}</a>`;

/* ============ SiteNav (components/ui/nav.tsx) ============ */
function siteNav(o = {}) {
  const links = ["destinations", "experiences", "about", "contact"].map((k) => `<a class="nlink">${t("nav." + k)}</a>`).join("");
  const lang = `<span class="sel" aria-label="${t("nav.language")}">${esc(LOC.toUpperCase())} ${IC.down}</span>`;
  const end = o.account ? `<span class="acct"><bdi dir="ltr">[Guest name]</bdi> ${IC.down}</span>` : `<a class="nlink">${t("nav.login")}</a>`;
  return `<header class="nav"><div class="navrow">${logo()}<button type="button" class="menu">${t("nav.menu")}</button><div class="navfull"><nav aria-label="Primary">${links}</nav><div class="tools">${lang}${end}</div></div></div></header>`;
}

/* ============ the trip page (PublicFrame > PageShell > TripLayout, step 4) ============ */
function stepRail() {
  const names = [t("steps.stay"), t("steps.addons"), t("steps.travelers"), t("steps.pay")];
  const rail = names.map((n, i) => i < 3
    ? `<li><span class="mark done" aria-hidden="true">${IC.check}</span><span>${n}</span></li>`
    : `<li class="cur" aria-current="step"><span class="mark cur tab-num" aria-hidden="true">4</span><span>${n}</span></li>`).join("");
  const phone = `<div class="prail"><ol aria-label="${t("steps.label")}">${names.map((n, i) => `<li${i === 3 ? ' aria-current="step"' : ""}><span class="sr">${n}</span></li>`).join("")}</ol><p class="t-cap muted">${fill(t("steps.phone"), { n: "4", name: names[3] })}</p></div>`;
  return `<ol class="rail" aria-label="${t("steps.label")}">${rail}</ol>${phone}`;
}
function cart(plan) {
  const planRows = plan === "full"
    ? `<div class="crow"><span>${t("cart.payFull")}</span><span>${B(AMT)}</span></div>`
    : `<div class="crow"><span>${t("cart.payFirst")}</span><span>${B(AMT)}</span></div><div class="crow"><span>${fill(t("cart.balanceBy"), { date: B(DATE) })}</span><span>${B(AMT)}</span></div>`;
  return `<div class="cart">
    <div class="stack g1"><p class="kick">${fill(t("cart.kicker"), { destination: B(esc(PLACE)) })}</p><h3 class="disp t-title teal">${B(esc(STAY))}</h3><p class="t-label muted">${B(RANGE)} · ${B("[Guests]")}</p></div>
    <div class="cline"><div class="crow"><span>${pl("cart.stay")}</span><span>${B(AMT)}</span></div><p class="kick" style="padding-top:8px">${pl("cart.addons")}</p><div class="crow"><span>${B("[Add-on name]")}</span><span>${B(AMT)}</span></div></div>
    <div class="stack g3 tab-num"><div class="crow"><span>${t("cart.subtotal")}</span><span>${B(AMT)}</span></div><div class="crow"><span>${t("cart.vat")}</span><span>${B(AMT)}</span></div><div class="crow b"><span>${t("cart.total")}</span><span>${B(AMT)}</span></div>${planRows}</div>
    <p class="t-cap muted">${t("cart.note")}</p></div>`;
}
function tripPage(body, plan) {

/* ============================ RENDER ============================ */
const rendered = new Set();
function frameHTML(id, tag) {
  const s = STATES[id];
  const first = !rendered.has(id);
  rendered.add(id);
  const body = s.fn();
  const url = s.url ? `<div class="urlbar">${esc(s.url())}</div>` : "";
  return `<div class="fr"${first ? ` id="s-${id}"` : ""}><div class="cap"><code>${id}-${WIDTH}-${LOC}</code>${tag ? `<span class="opt${/recommended/.test(tag) ? " rec" : ""}">${esc(tag)}</span>` : ""}<span class="rules">${esc(s.note)}</span></div>${url}<div class="fw" data-w="${WIDTH}"><div class="frame" style="width:${WIDTH}px" lang="${LOC}" dir="${LOC === "ar" ? "rtl" : "ltr"}">${body}</div></div></div>`;
}
function banner() {
  return `<div class="banner">
    <p><strong>04-06 pictures for signature (owner rule: no test, no shoot).</strong> One page replaces the plan's 162 PNGs: pick the language (EN, AR right to left, ES) and the width (390, 834, 1440) at the top; every state is drawn at that size, so the 8 trip states and 10 list states cover all 162 pictures. Choices (P6-07, P6-09) are drawn side by side.</p>
    <p>Every visible product string is read from the copy files as committed: JOURNEY_COPY (the new afterRequest group, and 04-03's bookingStatus, request, reasons, trip, steps and cart), GUEST_BOOKINGS_COPY (new), GUEST_COPY and the nav labels. Data is symbolic only: AED [AMOUNT], [DD/MM/YYYY], [HH:MM], [Stay name], [Destination], [Guest name], references like ALMAR-7K3QH9; no real price, date or person. The deadline line is 04-03's bookingStatus.payBy filled with the placeholders.</p>
    <p>Layout mirrors the real components: the nav (components/ui/nav.tsx), TripLayout and StepRail, 04-03's RequestStep and BookingReasons (closed, retry), the cart rail, and the bookings screen's heading and WhatsApp button. The sent, checking and moved-on blocks (RequestSent, RequestChecking, RequestElsewhere) and the list cards and tabs are the plan's new components, drawn from its text; they are not built yet. No card form, no Pay button and no bank details anywhere. The site footer and photos are labelled placeholders.</p>
    <p><strong>Changed since the plan:</strong> the list now lives at /&lt;locale&gt;/bookings (owner decision 13, job 21: the language is in the path), not one English path. P6-11's "cookie language + refresh" is superseded: a language pick opens the other language's path (/en/bookings, /ar/bookings, /es/bookings). Signed out, /&lt;locale&gt;/bookings goes to /&lt;locale&gt;/login?return=bookings.</p>
  </div>`;

function renderAll() {
  rendered.clear(); MISSING.clear();
  let html = banner();
  for (const g of GROUPS) {
    let inner;
    if (g.sig === "choice") inner = `<div class="cmp">${g.opts.map(([id, tag]) => frameHTML(id, tag)).join("")}</div>`;
    else inner = g.ids.map((id) => (rendered.has(id) ? `<div class="stub"><code>${id}</code> already drawn above: <a href="#s-${id}">jump to it</a>.</div>` : frameHTML(id))).join("");
    const tag = g.sig === "choice" ? '<span class="tag">Owner signature: choose</span>' : g.sig === "approve" ? '<span class="tag">Owner signature: approve or change</span>' : "";
    html += `<section class="grpbox" id="g-${g.id}"><h2>${esc(g.h)}</h2>${tag}<p class="q">${esc(g.q)}</p>${inner}</section>`;
  }
  html += draftTable();
  return html;
}
function fit() {
  const mainW = document.getElementById("main").clientWidth - 48;
  document.querySelectorAll(".fw").forEach((fw) => {
    const f = fw.firstElementChild, cmp = fw.closest(".cmp"), W = +fw.dataset.w;
    const avail = cmp ? (mainW - 20) / 2 : mainW;
    const sc = Math.min(1, avail / W);
    fw.style.width = Math.round(W * sc) + 2 + "px";
    f.style.transform = `scale(${sc})`;
    fw.style.height = Math.ceil(f.offsetHeight * sc) + 2 + "px";
  });
}
function buildIndex() {
  let h = "";
  for (const g of GROUPS) {
    h += `<h2>${esc(g.h.split(" · ")[0])}</h2><a href="#g-${g.id}">${esc(g.h.split(" · ").slice(1).join(" · ") || g.h)}</a>`;
    const ids = g.sig === "choice" ? g.opts.map((o) => o[0]) : g.ids;
    h += ids.map((id) => `<a class="st" href="#s-${id}">${id}</a>`).join("");
  }
  h += `<h2>Drafts</h2><a href="#g-drafts">AR and ES drafts table</a>`;
  document.getElementById("index").innerHTML = h;
}
function render() {
  document.getElementById("main").innerHTML = renderAll();
  document.getElementById("misslist").textContent = MISSING.size ? "MISSING COPY: " + [...MISSING].join(", ") : "";
  fit();
}
function setPressed() {
  document.querySelectorAll("#top [data-loc]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.loc === LOC));
  document.querySelectorAll("#top [data-w]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.w === WIDTH));
}
if (typeof document !== "undefined" && document.getElementById("main")) {
  document.querySelectorAll("#top [data-loc]").forEach((b) => b.addEventListener("click", () => { LOC = b.dataset.loc; setPressed(); render(); }));
  document.querySelectorAll("#top [data-w]").forEach((b) => b.addEventListener("click", () => { WIDTH = +b.dataset.w; setPressed(); render(); }));
  window.addEventListener("resize", fit);
  window.addEventListener("load", () => { fit(); setTimeout(fit, 400); });
  buildIndex(); setPressed(); render();
}
