# Review host for the Phase 3.3 slices: preview.almarprivatejourney.com. Deploy only from an out-preview/ built with
# `node scripts/assemble-cloudflare.mjs --target=preview` (it holds the noindex header and the disallow-all robots.txt).
# Never deployed by a work session: the controller creates Worker almar-preview on the owner's word. Job 10 gave this
# file and wrangler.toml the same server runtime (main, flags, ASSETS binding, run_worker_first); only the name,
# folder and route differ.
name = "almar-preview"
account_id = "f1d9a1fa3abdda98c15161b00b40385c"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = "worker/almar.mjs"
workers_dev = false
preview_urls = false

[assets]
directory = "./out-preview"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "preview.almarprivatejourney.com"
custom_domain = true
